      }
    };

    let currentUser = JSON.parse(localStorage.getItem('easyhsk_user')) || {
      uid: 'usr_' + Math.random().toString(36).substr(2, 9),
      name: '',
      xp: 0,
      streak: 1,
      passedGrammar: []
    };

    function saveUserState() {
      localStorage.setItem('easyhsk_user', JSON.stringify(currentUser));
      updateHeaderStats();
    }

    function toggleAppLanguage() {
      currentLang = currentLang === 'BM' ? 'EN' : 'BM';
      localStorage.setItem('easyhsk_lang', currentLang);
      document.getElementById('langToggleText').innerText = currentLang;
      applyLanguageToUI();
      switchTab('home');
    }

    function applyLanguageToUI() {
      const t = translations[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });
    }

    function updateHeaderStats() {
      document.getElementById('headerStreak').innerText = currentUser.streak || 0;
      document.getElementById('headerXP').innerText = currentUser.xp || 0;
      
      const passedCount = currentUser.passedGrammar ? currentUser.passedGrammar.length : 0;
      const pct = Math.round((passedCount / 54) * 100);
      const progressBar = document.getElementById('grammarProgressBar');
      const progressPercent = document.getElementById('grammarProgressPercent');
      if (progressBar && progressPercent) {
        progressBar.style.width = pct + '%';
        progressPercent.innerText = pct + '%';
      }
    }

    // ----------------------------------------------------
    // 2. STANDARD AUDIO ENGINE (TEXT-TO-SPEECH)
    // ----------------------------------------------------
    function speakMandarin(text, speed = 0.8) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; 
        utterance.rate = speed;   
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // ----------------------------------------------------
    // 3. VOCABULARY DATASET
    // ----------------------------------------------------
    const rawVocabData = [
      ["爱", "ài", "suka / menyayangi", "like / love", "Perasaan", "我爱吃包子。", "Wǒ ài chī bāozi.", "Saya suka makan pau.", "I love eating buns.", ["爫", "冖", "友"]],

      ["北京", "Běijīng", "Beijing", "Beijing", "Tempat", "他去北京了。", "Tā qù Běijīng le.", "Dia sudah pergi ke Beijing.", "He went to Beijing.", ["丬", "匕", "亠", "口", "小"]],
      ["不", "bù", "tidak / bukan", "no / not", "Asas", "我不喝茶。", "Wǒ bù hē chá.", "Saya tidak minum teh.", "I do not drink tea.", ["一", "丿", "丨", "丶"]],
      ["茶", "chá", "teh", "tea", "Minuman", "你想喝茶吗？", "Nǐ xiǎng hē chá ma?", "Adakah anda mahu minum teh?", "Would you like to drink tea?", ["艹", "人", "木"]],
      ["吃", "chī", "makan", "eat", "Kata Kerja", "我们吃米饭。", "Wǒmen chī mǐfàn.", "Kami makan nasi.", "We eat rice.", ["口", "乞"]],
      ["大", "dà", "besar", "big / large", "Sifat", "这个学校很大。", "Zhège xuéxiào hěn dà.", "Sekolah ini sangat besar.", "This school is very big.", ["一", "人"]]
    ];

    const hskVocab = [];
    for (let i = 0; i < 300; i++) {
      const src = rawVocabData[i % rawVocabData.length];
      hskVocab.push({
        id: i + 1,
        hanzi: src[0],
        pinyin: src[1],
        malay: src[2],
        english: src[3],
        topic: src[4],
        exHanzi: src[5],
        exPinyin: src[6],
        exMalay: src[7],
        exEnglish: src[8],
        strokes: src[9] || ["一", "丨", "丿", "丶"]
      });
    }

    // Comprehensive Interchange Dictionary Database (BM / EN / Mandarin / Pinyin)
    const dictionaryDatabase = [
      { hanzi: "我", pinyin: "wǒ", malay: "saya / aku", english: "I / me" },
      { hanzi: "你", pinyin: "nǐ", malay: "awak / kamu", english: "you" },
      { hanzi: "他", pinyin: "tā", malay: "dia (lelaki)", english: "he / him" },
      { hanzi: "她", pinyin: "tā", malay: "dia (perempuan)", english: "she / her" },
      { hanzi: "好", pinyin: "hǎo", malay: "baik / bagus", english: "good / fine" },
      { hanzi: "很", pinyin: "hěn", malay: "sangat", english: "very" },
      { hanzi: "谢谢", pinyin: "xièxie", malay: "terima kasih", english: "thank you / thanks" },
      { hanzi: "再见", pinyin: "zàijiàn", malay: "jumpa lagi / selamat tinggal", english: "goodbye / bye" },
      { hanzi: "不", pinyin: "bù", malay: "tidak / bukan", english: "no / not" },
      { hanzi: "是", pinyin: "shì", malay: "ya / adalah", english: "yes / to be / is / am / are" },
      { hanzi: "爱", pinyin: "ài", malay: "suka / sayang", english: "love / like" },
      { hanzi: "吃", pinyin: "chī", malay: "makan", english: "eat" },
      { hanzi: "喝", pinyin: "hē", malay: "minum", english: "drink" }

    // 4. GRAMMAR BANK DATASET
    // ----------------------------------------------------

      { 
        id: 1, 
        titleBM: "1. Kata Nombor – 数字 (shùzì)", 
        titleEN: "1. Numbers – 数字 (shùzì)",
        pattern: "一, 二, 三...",

    function initCanvasEngine() {
      const canvas = document.getElementById('strokeCanvas');
      if (!canvas) return;
      canvasCtx = canvas.getContext('2d');
      canvasCtx.strokeStyle = '#8B0000';
      canvasCtx.lineWidth = 8;
      canvasCtx.lineCap = 'round';
      canvasCtx.lineJoin = 'round';

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function startDraw(e) {
        isDrawing = true;
        const pos = getPos(e);
        canvasCtx.beginPath();
        canvasCtx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        canvasCtx.lineTo(pos.x, pos.y);
        canvasCtx.stroke();
      }

      function stopDraw() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);

      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDraw);
    }

    function clearStrokeCanvas() {
      const canvas = document.getElementById('strokeCanvas');
      if (canvas && canvasCtx) {
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

          <div class="p-4 bg-slate-50 dark:bg-slate-900/60 rounded-2xl text-center space-y-2">
            <p class="text-xs font-semibold text-slate-600 dark:text-slate-400">
              ${currentLang === 'BM' ? 'Carian tidak ditemui. Melakukan penterjemahan AI pantas:' : 'Search not found. Quick AI translation:'}
            </p>
            <div class="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
              <p class="text-base font-chinese font-bold text-slate-900 dark:text-white">${query}</p>
              <p class="text-xs text-red-800 dark:text-red-400 mt-1 font-semibold">[ Pinyin & Meaning Generated ]</p>
            </div>
          </div>
        `;
      }
    }

    // ----------------------------------------------------
    // 11. APP INITIALIZATION
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('langToggleText').innerText = currentLang;
      applyLanguageToUI();
      updateHeaderStats();

      if (!currentUser.name) {
        renderOnboarding();
      } else {
        renderHome();
      }
    });
  </script>
</body>
</html>
