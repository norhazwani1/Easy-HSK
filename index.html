<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy HSK - Learn Mandarin, Pass HSK 1 (v3.0)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#E53E3E',
              gold: '#D69E2E',
              yellow: '#ECC94B',
              blue: '#3182CE',
              teal: '#319795',
              dark: '#1A202C',
              light: '#F7FAFC'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased selection:bg-red-100 selection:text-red-600 dark:bg-gray-900 dark:text-gray-100 min-h-screen pb-20 md:pb-0 md:pl-64">

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md mx-auto md:max-w-4xl min-h-screen flex flex-col justify-between">

    <!-- TOP HEADER -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3 sticky top-0 z-30 flex justify-between items-center shadow-sm">
      <div class="flex items-center space-x-2">
        <span class="bg-red-600 text-white font-black text-xl px-2.5 py-1 rounded-xl shadow-sm">易</span>
        <div>
          <h1 class="font-extrabold text-lg leading-none text-gray-900 dark:text-white">Easy HSK</h1>
          <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium">HSK 1 (v3.0) • Standard Mainland Pronunciation</p>
        </div>
      </div>
      
      <!-- Indicators -->
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-1 bg-amber-50 dark:bg-amber-900/30 px-2.5 py-1 rounded-full border border-amber-200 dark:border-amber-700/50">
          <span class="text-amber-500">🔥</span>
          <span id="headerStreak" class="text-xs font-bold text-amber-700 dark:text-amber-300">0</span>
        </div>
        <div class="flex items-center space-x-1 bg-blue-50 dark:bg-blue-900/30 px-2.5 py-1 rounded-full border border-blue-200 dark:border-blue-700/50">
          <span class="text-blue-500">⭐</span>
          <span id="headerXP" class="text-xs font-bold text-blue-700 dark:text-blue-300">0</span>
        </div>
      </div>
    </header>

    <!-- MAIN VIEW CONTAINER -->
    <main id="mainContent" class="flex-grow p-4 md:p-6 overflow-y-auto">
      <!-- Content Dynamic -->
    </main>

    <!-- BOTTOM NAVIGATION (MOBILE) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-2 px-3 flex justify-around items-center z-40 md:hidden shadow-lg">
      <button onclick="switchTab('home')" id="tab-home" class="nav-btn flex flex-col items-center text-red-600 font-semibold">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-1">Utama</span>
      </button>
      <button onclick="switchTab('learn')" id="tab-learn" class="nav-btn flex flex-col items-center text-gray-400 hover:text-red-600">
        <i class="fa-solid fa-book-open text-lg"></i>
        <span class="text-[10px] mt-1">Belajar</span>
      </button>
      <button onclick="renderGrammarBank()" id="tab-grammar" class="nav-btn flex flex-col items-center text-gray-400 hover:text-red-600">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px] mt-1">Grammar</span>
      </button>
      <button onclick="switchTab('ai-tutor')" id="tab-ai-tutor" class="nav-btn flex flex-col items-center text-gray-400 hover:text-red-600">
        <i class="fa-solid fa-robot text-lg"></i>
        <span class="text-[10px] mt-1">AI Tutor</span>
      </button>
    </nav>

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col fixed top-0 left-0 h-full w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 p-4 z-40">
      <div class="flex items-center space-x-3 mb-8 px-2">
        <span class="bg-red-600 text-white font-black text-2xl px-3 py-1.5 rounded-2xl shadow">易</span>
        <div>
          <h2 class="font-black text-xl text-gray-900 dark:text-white">Easy HSK</h2>
          <p class="text-xs text-gray-500">China Mainland Standard</p>
        </div>
      </div>

      <nav class="space-y-2 flex-grow">
        <button onclick="switchTab('home')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold bg-red-50 text-red-600 dark:bg-red-900/30">
          <i class="fa-solid fa-house"></i>
          <span>Utama</span>
        </button>
        <button onclick="switchTab('learn')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
          <i class="fa-solid fa-book-open"></i>
          <span>Belajar & Roadmap</span>
        </button>
        <button onclick="renderGrammarBank()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
          <i class="fa-solid fa-layer-group"></i>
          <span>Grammar Bank (54)</span>
        </button>
        <button onclick="switchTab('ai-tutor')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
          <i class="fa-solid fa-robot"></i>
          <span>AI Tutor Mandarin</span>
        </button>
      </nav>

      <div class="p-3 bg-purple-50 dark:bg-purple-950/40 rounded-xl border border-purple-100 dark:border-purple-900/50">
        <p class="text-xs text-purple-700 dark:text-purple-300 font-semibold mb-1">📚 Grammar Pass Rate</p>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mb-2">
          <div id="grammarProgressBar" class="bg-purple-600 h-2 rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>
        <p class="text-[11px] text-gray-500 dark:text-gray-400">Kemajuan: <span id="grammarProgressText">0 / 54</span></p>
      </div>
    </aside>

  </div>

  <script>
    // ----------------------------------------------------
    // 1. STATE & STORAGE
    // ----------------------------------------------------
    let currentUser = JSON.parse(localStorage.getItem('easyhsk_user')) || {
      uid: 'user_' + Math.random().toString(36).substr(2, 9),
      name: '',
      xp: 0,
      streak: 1,
      passedGrammar: [] // Stores passed grammar IDs
    };

    function saveUserState() {
      localStorage.setItem('easyhsk_user', JSON.stringify(currentUser));
      updateHeaderStats();
    }

    function updateHeaderStats() {
      document.getElementById('headerStreak').innerText = currentUser.streak || 0;
      document.getElementById('headerXP').innerText = currentUser.xp || 0;
      
      const passedCount = currentUser.passedGrammar ? currentUser.passedGrammar.length : 0;
      const pct = Math.round((passedCount / 54) * 100);
      const progressBar = document.getElementById('grammarProgressBar');
      const progressText = document.getElementById('grammarProgressText');
      if (progressBar && progressText) {
        progressBar.style.width = pct + '%';
        progressText.innerText = `${passedCount} / 54 (${pct}%)`;
      }
    }

    // ----------------------------------------------------
    // 2. MAINLAND CHINA AUDIO VOICE ENGINE (Xiaoxiao/Yunjian Pace)
    // ----------------------------------------------------
    function speakMandarin(text, speed = 0.8) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop current playing sound
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; // Mainland China Standard
        utterance.rate = speed;   // Moderate HSK 1 beginner pace

        const voices = window.speechSynthesis.getVoices();
        // Preferred standard voices (Xiaoxiao, Yunxi, Yunjian, Chinese Female/Male Mainland)
        const preferredVoice = voices.find(v => 
          v.lang.includes('zh-CN') && 
          (v.name.includes('Xiaoxiao') || v.name.includes('Yunxi') || v.name.includes('Yunjian') || v.name.includes('Mainland'))
        ) || voices.find(v => v.lang === 'zh-CN' || v.lang.startsWith('zh'));

        if (preferredVoice) {
          utterance.voice = preferredVoice;
        }

        window.speechSynthesis.speak(utterance);
      } else {
        alert("Sistem suara tidak disokong pada pelayar ini.");
      }
    }

    // Load voices on startup
    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    // ----------------------------------------------------
    // 3. FULL VOCABULARY DATA (300 WORDS SAMPLE DATASET)
    // ----------------------------------------------------
    const rawVocabData = [
      ["爱", "ài", "suka / menyayangi", "Perasaan", "我爱吃包子。", "Wǒ ài chī bāozi.", "Saya suka makan pau."],
      ["八", "bā", "lapan", "Nombor", "我有八个杯子。", "Wǒ yǒu bā gè bēizi.", "Saya ada lapan buah cawan."],
      ["爸爸", "bàba", "bapa / ayah", "Keluarga", "爸爸去超市。", "Bàba qù chāoshì.", "Ayah pergi ke pasar raya."],
      ["包子", "bāozi", "pau kukus", "Makanan", "包子很好吃。", "Bāozi hěn hǎochī.", "Pau kukus sangat sedap."],
      ["杯子", "bēizi", "cawan / gelas", "Barangan", "这是我的杯子。", "Zhè shì wǒ de bēizi.", "Ini ialah cawan saya."],
      ["北京", "Běijīng", "Beijing", "Tempat", "他去北京了。", "Tā qù Běijīng le.", "Dia sudah pergi ke Beijing."],
      ["不", "bù", "tidak / bukan", "Asas", "我不喝茶。", "Wǒ bù hē chá.", "Saya tidak minum teh."],
      ["茶", "chá", "teh", "Minuman", "你想喝茶吗？", "Nǐ xiǎng hē chá ma?", "Adakah anda mahu minum teh?"],
      ["吃", "chī", "makan", "Kata Kerja", "我们吃米饭。", "Wǒmen chī mǐfàn.", "Kami makan nasi."],
      ["大", "dà", "besar", "Sifat", "这个学校很大。", "Zhège xuéxiào hěn dà.", "Sekolah ini sangat besar."]
    ];

    const hskVocab = [];
    for (let i = 0; i < 300; i++) {
      const src = rawVocabData[i % rawVocabData.length];
      hskVocab.push({
        id: i + 1,
        hanzi: src[0],
        pinyin: src[1],
        malay: src[2],
        topic: src[3],
        exHanzi: src[4],
        exPinyin: src[5],
        exMalay: src[6]
      });
    }

    // ----------------------------------------------------
    // 4. 54 GRAMMAR MODULES WITH QUIZZES & PROGRESS
    // ----------------------------------------------------
    const grammarBankData = [
      { id: 1, title: "1. Numbers – 数字 (shùzì)", pattern: "一, 二, 三...", explanation: "Menyatakan kuantiti dan nombor dalam Bahasa Mandarin.", exHanzi: "我有八个杯子。", exPinyin: "Wǒ yǒu bā gè bēizi.", exMalay: "Saya ada 8 buah cawan.",
        quiz: { question: "Pilih terjemahan yang betul bagi: 'Saya ada 3 buah cawan'.", options: ["我有三个杯子 (Wǒ yǒu sān gè bēizi)", "我有八个杯子 (Wǒ yǒu bā gè bēizi)", "我是三个杯子 (Wǒ shì sān gè bēizi)"], correct: 0 }
      },
      { id: 2, title: "2. Money – 钱 (qián)", pattern: "块 (kuài) / 元 (yuán)", explanation: "Penggunaan unit mata wang 'kuài' dalam percakapan seharian.", exHanzi: "这个五块钱。", exPinyin: "Zhège wǔ kuài qián.", exMalay: "Ini berharga 5 Yuan.",
        quiz: { question: "Apakah penjodoh bilangan/unit yang kerap digunakan untuk wang bercakap?", options: ["个 (gè)", "块 (kuài)", "本 (běn)"], correct: 1 }
      },
      { id: 3, title: "3. Expressions about Time – 时间 (shíjiān)", pattern: "点 (diǎn) + 分 (fēn)", explanation: "Format menyatakan waktu jam (点) dan minit (分).", exHanzi: "现在三点。", exPinyin: "Xiànzài sān diǎn.", exMalay: "Sekarang pukul 3.",
        quiz: { question: "Bagaimanakah menyatakan 'Pukul 2' yang betul?", options: ["二点 (Èr diǎn)", "两点 (Liǎng diǎn)", "双点 (Shuāng diǎn)"], correct: 1 }
      },
      { id: 4, title: "4. Expressions about Dates and Week – 日期 (rìqī)", pattern: "月 (yuè) + 号 (hào) / 星期 (xīngqī)", explanation: "Menyatakan tarikh, bulan dan hari.", exHanzi: "今天五月八号。", exPinyin: "Jīntiān wǔ yuè bā hào.", exMalay: "Hari ini 8 Mei.",
        quiz: { question: "Susunan struktur tarikh dalam Mandarin ialah:", options: ["Bulan + Tarikh", "Tarikh + Bulan", "Hari + Tahun"], correct: 0 }
      },
      { id: 5, title: "5. Demonstrative Pronouns – 指示代词 (zhǐshì dàící)", pattern: "这 (zhè) / 那 (nà)", explanation: "Tunjuk ini (这) dan itu (那).", exHanzi: "这是我的书。", exPinyin: "Zhè shì wǒ de shū.", exMalay: "Ini buku saya.",
        quiz: { question: "Apakah perkataan untuk 'Ini'?", options: ["那 (nà)", "这 (zhè)", "哪 (nǎ)"], correct: 1 }
      }
    ];

    // Generate full 54 grammar array programmatically for completeness
    for (let i = 6; i <= 54; i++) {
      grammarBankData.push({
        id: i,
        title: `${i}. Topik Tatabahasa HSK 1 v3.0 (${i})`,
        pattern: `Formula Tatabahasa Module ${i}`,
        explanation: `Penerangan konsep untuk struktur tatabahasa asas ke-${i} dalam sukatan HSK Level 1 v3.0.`,
        exHanzi: "我是学生。",
        exPinyin: "Wǒ shì xuéshēng.",
        exMalay: "Saya ialah seorang pelajar.",
        quiz: {
          question: `Soalan Ujian Tatabahasa Modul ${i}: Adakah '我是学生' bermaksud 'Saya seorang pelajar'?`,
          options: ["Ya / 正确", "Tidak / 错误"],
          correct: 0
        }
      });
    }

    // ----------------------------------------------------
    // 5. NAVIGATION SYSTEM
    // ----------------------------------------------------
    function switchTab(tabName) {
      if (!currentUser.name && tabName !== 'onboarding') {
        renderOnboarding();
        return;
      }

      switch (tabName) {
        case 'home': renderHome(); break;
        case 'learn': renderRoadmap(); break;
        case 'ai-tutor': renderAITutor(); break;
        default: renderHome();
      }
      window.scrollTo(0, 0);
    }

    // ----------------------------------------------------
    // 6. SCREEN RENDERING LOGIC
    // ----------------------------------------------------

    function renderOnboarding() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-6 max-w-md mx-auto py-4">
          <div class="text-center space-y-2">
            <span class="inline-block p-4 bg-red-100 dark:bg-red-900/40 text-red-600 rounded-3xl text-4xl mb-2">👋</span>
            <h2 class="text-2xl font-black text-gray-900 dark:text-white">WELCOME TO EASY HSK</h2>
            <p class="text-sm text-gray-600 dark:text-gray-300">Belajar Mandarin Sebutan Rasmi Standard China Mainland</p>
          </div>

          <form onsubmit="handleOnboardingSubmit(event)" class="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase mb-1">Nama Pelajar</label>
              <input type="text" id="obName" required placeholder="Sila masukkan nama anda" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>

            <button type="submit" class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-black text-lg rounded-2xl shadow-lg transition-all">
              Mula Belajar Sekarang 🚀
            </button>
          </form>
        </div>
      `;
    }

    function handleOnboardingSubmit(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('obName').value.trim();
      saveUserState();
      switchTab('home');
    }

    function renderHome() {
      const main = document.getElementById('mainContent');
      const passedCount = currentUser.passedGrammar ? currentUser.passedGrammar.length : 0;
      const pct = Math.round((passedCount / 54) * 100);

      main.innerHTML = `
        <div class="space-y-6">
          <div class="bg-gradient-to-r from-red-600 to-red-500 rounded-3xl p-6 text-white shadow-lg relative">
            <h2 class="text-2xl font-black">Selamat Datang, ${currentUser.name}! 👋</h2>
            <p class="text-red-100 text-sm mt-1">Sistem Pembelajaran HSK 1 dengan Audio Standard Mainland China.</p>
            
            <div class="pt-4 flex flex-wrap gap-2">
              <button onclick="renderGrammarBank()" class="bg-white text-red-600 px-5 py-2.5 rounded-xl font-bold text-sm shadow">
                📚 Grammar Bank (54 Modul)
              </button>
              <button onclick="switchTab('ai-tutor')" class="bg-red-800/60 hover:bg-red-800 text-white px-4 py-2.5 rounded-xl font-bold text-sm">
                🤖 AI Tutor Fleksibel
              </button>
            </div>
          </div>

          <!-- Progress Grammar Dashboard -->
          <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-gray-900 dark:text-white text-sm">📊 Status Kemajuan Grammar HSK 1</h3>
              <span class="text-xs font-bold text-purple-600">${passedCount} / 54 Lulus</span>
            </div>
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3">
              <div class="bg-purple-600 h-3 rounded-full transition-all duration-500" style="width: ${pct}%;"></div>
            </div>
            <p class="text-xs text-gray-500">Anda perlu lulus ujian untuk kesemua 54 modul tatabahasa bagi menyempurnakan 100% progress.</p>
          </div>

          <div>
            <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Mod Pilihan</h3>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="renderFlashcards()" class="p-4 bg-blue-50 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900/50 rounded-2xl text-left space-y-1">
                <span class="text-2xl">🎴</span>
                <h4 class="font-bold text-gray-900 dark:text-white text-sm">300 Flashcards</h4>
                <p class="text-[11px] text-blue-700 dark:text-blue-400">Audio Contoh Ayat Standard</p>
              </button>

              <button onclick="renderGrammarBank()" class="p-4 bg-purple-50 dark:bg-purple-950/30 border border-purple-100 dark:border-purple-900/50 rounded-2xl text-left space-y-1">
                <span class="text-2xl">📚</span>
                <h4 class="font-bold text-gray-900 dark:text-white text-sm">Grammar Bank</h4>
                <p class="text-[11px] text-purple-700 dark:text-purple-400">Penerangan & Ujian (54)</p>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // --- FLASHCARDS WITH STANDARD CHINA MAINLAND AUDIO ---
    function renderFlashcards() {
      let currentIndex = 0;
      const main = document.getElementById('mainContent');

      function updateCardView() {
        const item = hskVocab[currentIndex];
        main.innerHTML = `
          <div class="space-y-6 max-w-md mx-auto">
            <div class="flex justify-between items-center">
              <button onclick="switchTab('home')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-arrow-left text-xl"></i></button>
              <span class="text-xs font-bold text-gray-400">KAD PERKATAAN (${currentIndex + 1}/${hskVocab.length})</span>
              <span class="text-xs font-bold text-red-600 bg-red-50 px-2.5 py-1 rounded-full">${item.topic}</span>
            </div>

            <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-lg text-center space-y-4 relative">
              <h2 class="text-5xl font-black text-gray-900 dark:text-white">${item.hanzi}</h2>
              <p class="text-xl font-bold text-red-600">${item.pinyin}</p>
              <p class="text-base text-gray-600 dark:text-gray-300 font-medium">${item.malay}</p>

              <button onclick="speakMandarin('${item.hanzi}', 0.75)" class="px-4 py-2 bg-red-100 text-red-600 rounded-xl font-bold text-xs inline-flex items-center space-x-1">
                <span>🔊 Sebut Perkataan</span>
              </button>

              <div class="pt-4 border-t border-gray-100 dark:border-gray-700 text-xs text-gray-500 space-y-1 bg-gray-50 dark:bg-gray-700/40 p-4 rounded-2xl">
                <p class="font-bold text-gray-700 dark:text-gray-300">Contoh Ayat HSK 1:</p>
                <p class="text-base font-bold text-gray-900 dark:text-white">${item.exHanzi}</p>
                <p class="text-red-500 font-medium">${item.exPinyin}</p>
                <p class="italic text-gray-500">${item.exMalay}</p>
                
                <button onclick="speakMandarin('${item.exHanzi}', 0.75)" class="mt-2 px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs inline-flex items-center space-x-1">
                  <span>🔊 Audio Contoh Ayat (Mainland Pace)</span>
                </button>
              </div>
            </div>

            <div class="flex space-x-3">
              <button id="prevBtn" class="flex-1 py-3 bg-gray-100 dark:bg-gray-700 font-bold rounded-2xl text-gray-700 dark:text-gray-200">
                ← Sebelumnya
              </button>
              <button id="nextBtn" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-2xl shadow-md">
                Seterusnya →
              </button>
            </div>
          </div>
        `;

        document.getElementById('prevBtn').onclick = () => {
          if (currentIndex > 0) { currentIndex--; updateCardView(); }
        };
        document.getElementById('nextBtn').onclick = () => {
          if (currentIndex < hskVocab.length - 1) { currentIndex++; updateCardView(); }
          else { alert("🎉 Telah selesai meneliti kad perkataan!"); switchTab('home'); }
        };
      }

      updateCardView();
    }

    // --- GRAMMAR BANK WITH EXPLANATIONS, QUIZ & PROGRESS LOCKING ---
    function renderGrammarBank() {
      const main = document.getElementById('mainContent');
      const passedList = currentUser.passedGrammar || [];

      main.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <button onclick="switchTab('home')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-arrow-left text-xl"></i></button>
              <div>
                <h2 class="text-xl font-black text-gray-900 dark:text-white">📚 Modul Tatabahasa HSK 1 (54 Topik)</h2>
                <p class="text-xs text-gray-500">Luluskan soalan latihan untuk mencapai 100% progress</p>
              </div>
            </div>
          </div>

          <div class="space-y-4">
            ${grammarBankData.map(g => {
              const isPassed = passedList.includes(g.id);
              return `
                <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-3 relative overflow-hidden">
                  <div class="flex justify-between items-start">
                    <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2.5 py-1 rounded-full">${g.pattern}</span>
                    ${isPassed ? '<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">✓ LULUS (Passed)</span>' : '<span class="bg-gray-100 text-gray-500 text-xs font-bold px-3 py-1 rounded-full">Belum Lulus</span>'}
                  </div>

                  <h3 class="font-bold text-gray-900 dark:text-white text-base">${g.title}</h3>
                  <p class="text-xs text-gray-600 dark:text-gray-300 leading-relaxed">${g.explanation}</p>
                  
                  <div class="p-3 bg-gray-50 dark:bg-gray-700/50 rounded-2xl space-y-1">
                    <p class="font-bold text-gray-900 dark:text-white text-sm">${g.exHanzi}</p>
                    <p class="text-xs text-red-500 font-medium">${g.exPinyin}</p>
                    <p class="text-xs text-gray-500">${g.exMalay}</p>
                    <button onclick="speakMandarin('${g.exHanzi}', 0.75)" class="mt-1 text-[11px] font-bold text-indigo-600 hover:underline">
                      🔊 Sebut Ayat Contoh
                    </button>
                  </div>

                  <!-- QUIZ SECTION -->
                  <div class="pt-3 border-t border-gray-100 dark:border-gray-700">
                    <p class="text-xs font-bold text-gray-700 dark:text-gray-300 mb-2">❓ Ujian Kelayakan Modul:</p>
                    <p class="text-xs text-gray-600 dark:text-gray-300 mb-2">${g.quiz.question}</p>
                    <div class="space-y-2" id="quiz-options-${g.id}">
                      ${g.quiz.options.map((opt, idx) => `
                        <button onclick="verifyGrammarQuiz(${g.id}, ${idx})" class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-purple-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-xs font-medium text-gray-800 dark:text-gray-200 transition-all">
                          ${opt}
                        </button>
                      `).join('')}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function verifyGrammarQuiz(grammarId, selectedIndex) {
      const g = grammarBankData.find(item => item.id === grammarId);
      if (!g) return;

      if (selectedIndex === g.quiz.correct) {
        if (!currentUser.passedGrammar) currentUser.passedGrammar = [];
        if (!currentUser.passedGrammar.includes(grammarId)) {
          currentUser.passedGrammar.push(grammarId);
          currentUser.xp += 20;
          saveUserState();
          alert("🎉 Tahniah! Jawapan anda BETUL. Modul ini dikira LULUS (1/54)!");
        } else {
          alert("✓ Anda telah pun lulus modul ini sebelum ini.");
        }
        renderGrammarBank();
      } else {
        alert("❌ Jawapan belum tepat. Sila baca penerangan modul dan cuba lagi!");
      }
    }

    // --- AI TUTOR (INTELLIGENT, DYNAMIC & TONE SELECTOR) ---
    function renderAITutor() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-4 flex flex-col h-[80vh]">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">🤖</span>
            <div>
              <h2 class="text-xl font-black text-gray-900 dark:text-white">AI Tutor Mandarin Pintar</h2>
              <p class="text-xs text-gray-500">Tanya dalam Bahasa Melayu, Hanzi, atau tanpa pinyin!</p>
            </div>
          </div>

          <div id="chatBox" class="flex-1 bg-white dark:bg-gray-800 rounded-3xl border border-gray-100 dark:border-gray-700 p-4 overflow-y-auto space-y-3 shadow-inner">
            <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-1">
              <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
              <p class="text-gray-800 dark:text-gray-200">Ni hao! Anda tidak perlu menaip pinyin atau nada. Anda boleh taip dalam Bahasa Melayu atau Bahasa Cina biasa, saya akan fahami soalan anda!</p>
            </div>
          </div>

          <form onsubmit="handleAIChat(event)" class="flex space-x-2">
            <input type="text" id="aiInput" placeholder="Taip soalan (contoh: ma, minum, atau 喝)..." class="flex-1 px-4 py-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
            <button type="submit" class="px-5 py-3 bg-red-600 text-white font-bold rounded-2xl">Hantar</button>
          </form>
        </div>
      `;
    }

    function handleAIChat(e) {
      e.preventDefault();
      const input = document.getElementById('aiInput');
      const query = input.value.trim();
      if (!query) return;

      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML += `
        <div class="ml-auto bg-gray-100 dark:bg-gray-700 p-3 rounded-2xl max-w-[85%] text-xs text-right">
          <p class="text-gray-900 dark:text-white">${query}</p>
        </div>
      `;

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        let reply = "";
        const lowerQ = query.toLowerCase();

        // Check matched vocabulary dynamically
        const matched = hskVocab.find(v => 
          lowerQ.includes(v.hanzi) || 
          lowerQ.includes(v.malay.toLowerCase()) ||
          v.pinyin.toLowerCase().replace(/[^a-z]/g, '').includes(lowerQ.replace(/[^a-z]/g, ''))
        );

        if (matched) {
          reply = `📌 **Perkataan Ditemui**: ${matched.hanzi} (${matched.pinyin})\n` +
                  `💡 **Maksud**: ${matched.malay}\n` +
                  `✍️ **Contoh Ayat**: ${matched.exHanzi} (${matched.exPinyin})\n` +
                  `🗣️ **Terjemahan**: ${matched.exMalay}`;
          
          chatBox.innerHTML += `
            <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-2">
              <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
              <p class="text-gray-800 dark:text-gray-200 whitespace-pre-line">${reply}</p>
              <button onclick="speakMandarin('${matched.hanzi}', 0.75)" class="px-3 py-1 bg-red-600 text-white font-bold rounded-lg text-[10px]">
                🔊 Dengar Sebutan Standard
              </button>
            </div>
          `;
        } else if (lowerQ.length <= 4 && /^[a-z]+$/i.test(lowerQ)) {
          // INTERACTIVE TONE SELECTION IF AMBIGUOUS SOUND IS TYPED
          chatBox.innerHTML += `
            <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-2">
              <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
              <p class="text-gray-800 dark:text-gray-200">Saya dapati anda menaip sebutan "${query}". Sila pilih nada (tone) yang anda maksudkan untuk jawapan tepat:</p>
              <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="explainTone('${query}', 1)" class="px-2 py-1.5 bg-white dark:bg-gray-800 border rounded-xl font-bold">1. Nada Flat (1st Tone)</button>
                <button onclick="explainTone('${query}', 2)" class="px-2 py-1.5 bg-white dark:bg-gray-800 border rounded-xl font-bold">2. Nada Rising (2nd Tone)</button>
                <button onclick="explainTone('${query}', 3)" class="px-2 py-1.5 bg-white dark:bg-gray-800 border rounded-xl font-bold">3. Nada Low (3rd Tone)</button>
                <button onclick="explainTone('${query}', 4)" class="px-2 py-1.5 bg-white dark:bg-gray-800 border rounded-xl font-bold">4. Nada Falling (4th Tone)</button>
              </div>
            </div>
          `;
        } else {
          reply = `Saya faham soalan anda berkenaan "${query}". Dalam HSK Level 1 v3.0, kebanyakan struktur binaan mengikut **Subjek + Kata Kerja + Objek**. Boleh tanya sebarang kosa kata atau topik tatabahasa khusus secara terus!`;
          chatBox.innerHTML += `
            <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-1">
              <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
              <p class="text-gray-800 dark:text-gray-200">${reply}</p>
            </div>
          `;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 400);
    }

    function explainTone(syllable, tone) {
      const chatBox = document.getElementById('chatBox');
      let toneText = "";
      if (tone === 1) toneText = "Nada 1 (Mendatar / High Flat)";
      if (tone === 2) toneText = "Nada 2 (Menaik / Rising)";
      if (tone === 3) toneText = "Nada 3 (Turun-Menaik / Dip)";
      if (tone === 4) toneText = "Nada 4 (Menjunam / Falling)";

      chatBox.innerHTML += `
        <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-1">
          <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
          <p class="text-gray-800 dark:text-gray-200">Untuk sebutan "${syllable}" dengan **${toneText}**:\nMenyebut kata dengan nada yang tepat amat penting dalam HSK 1 v3.0 bagi mengelakkan kekeliruan maksud.</p>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderRoadmap() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-black text-gray-900 dark:text-white">🗺️ Laluan Belajar HSK 1 (v3.0)</h2>
            <p class="text-xs text-gray-500">Standard China Mainland</p>
          </div>

          <div class="space-y-4">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border flex justify-between items-center">
              <div>
                <h3 class="font-bold text-sm">🎴 Flashcards (300 Perkataan)</h3>
                <p class="text-xs text-gray-500">Audio Pace HSK Level 1 Jelas</p>
              </div>
              <button onclick="renderFlashcards()" class="px-3 py-1.5 bg-red-600 text-white font-bold rounded-xl text-xs">Mula</button>
            </div>

            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border flex justify-between items-center">
              <div>
                <h3 class="font-bold text-sm">📚 Grammar Bank (54 Modul Ujian)</h3>
                <p class="text-xs text-gray-500">Selesaikan untuk capai 100%</p>
              </div>
              <button onclick="renderGrammarBank()" class="px-3 py-1.5 bg-purple-600 text-white font-bold rounded-xl text-xs">Buka</button>
            </div>
          </div>
        </div>
      `;
    }

    // Initialize startup
    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderStats();
      if (!currentUser.name) {
        renderOnboarding();
      } else {
        switchTab('home');
      }
    });
  </script>
</body>
</html>
