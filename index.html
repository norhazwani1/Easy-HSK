    let currentUser = JSON.parse(localStorage.getItem('easyhsk_user')) || {
      uid: 'user_' + Math.random().toString(36).substr(2, 9),

    let audioSpeed = 1.0; // Audio Speed (Normal: 1.0, Slow: 0.6)

    // Save user state locally and sync to Firebase Realtime DB
    function saveUserState() {
      localStorage.setItem('easyhsk_user', JSON.stringify(currentUser));
      if (currentUser.uid) {
        db.ref('users/' + currentUser.uid).set(currentUser);
      }
      updateHeaderStats();
    }

    function updateHeaderStats() {
      document.getElementById('headerStreak').innerText = currentUser.streak || 0;
      document.getElementById('headerXP').innerText = currentUser.xp || 0;
      const dBar = document.getElementById('desktopHskBar');
      const dPct = document.getElementById('desktopHskPct');
      if (dBar && dPct) {
        dBar.style.width = (currentUser.hskReadiness || 15) + '%';
        dPct.innerText = (currentUser.hskReadiness || 15) + '%';
      }
    }

    // 3. CORE MANDARIN DATA (HSK 1 Syllabus & Topics)
    // ----------------------------------------------------
    const hskVocab = [

      { id: 4, hanzi: "我", pinyin: "wǒ", malay: "saya", topic: "People", exHanzi: "我是学生。", exPinyin: "Wǒ shì xuéshēng.", exMalay: "Saya seorang pelajar." },
      { id: 5, hanzi: "你", pinyin: "nǐ", malay: "awak / kamu", topic: "People", exHanzi: "你是老师吗？", exPinyin: "Nǐ shì lǎoshī ma?", exMalay: "Adakah awak seorang guru?" },

      { id: 7, hanzi: "她", pinyin: "tā", malay: "dia (perempuan)", topic: "People", exHanzi: "她很漂亮。", exPinyin: "Tā hěn piàoliang.", exMalay: "Dia sangat cantik." },

      { id: 9, hanzi: "茶", pinyin: "chá", malay: "teh", topic: "Food & Drinks", exHanzi: "我不喝茶。", exPinyin: "Wǒ bù hē chá.", exMalay: "Saya tidak minum teh." },
      { id: 10, hanzi: "学校", pinyin: "xuéxiào", malay: "sekolah", topic: "School", exHanzi: "我在学校上课。", exPinyin: "Wǒ zài xuéxiào shàngkè.", exMalay: "Saya belajar di sekolah." }
    ];

    const grammarPoints = [
      {
        id: "g1",
        title: "Ayat Penyata Adalah (是)",
        pattern: "Subjek + 是 + Kata Nama",
        explanation: "Gunakan '是' (shì) untuk menyatakan 'adalah' atau 'ialah'. Sama seperti 'is/am/are' dalam Bahasa Inggeris.",
        exHanzi: "我是学生。",
        exPinyin: "Wǒ shì xuéshēng.",
        exMalay: "Saya ialah seorang pelajar.",
        quizQ: "Saya ___ guru (老师).",
        options: ["是 (shì)", "不 (bù)", "很 (hěn)"],
        ans: 0
      },
      {
        id: "g2",
        title: "Ayat Negatif (不)",
        pattern: "Subjek + 不 + Kata Kerja / Sifat",
        explanation: "Perkataan '不' (bù) digunakan untuk menafikan perbuatan atau sifat (maksud: tidak / bukan).",
        exHanzi: "我不喝茶。",
        exPinyin: "Wǒ bù hē chá.",
        exMalay: "Saya tidak minum teh.",
        quizQ: "Pilih ayat 'Saya tidak pergi':",
        options: ["我不去 (Wǒ bù qù)", "我是去 (Wǒ shì qù)", "我好去 (Wǒ hǎo qù)"],
        ans: 0
      }
    ];

    // ----------------------------------------------------
    // 4. AUDIO TEXT-TO-SPEECH SYSTEM
    // ----------------------------------------------------
    function speakMandarin(text, speed = audioSpeed) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop ongoing speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = speed;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Sistem audio tidak disokong pada pelayar ini.");
      }
    }

    // ----------------------------------------------------
    // 5. NAVIGATION & ROUTING
    // ----------------------------------------------------
    function switchTab(tabName) {
      // Update UI buttons styling
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-red-600');
        btn.classList.add('text-gray-400');
      });
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-400');
        activeBtn.classList.add('text-red-600');
      }

      const mainContent = document.getElementById('mainContent');

      if (!currentUser.name && tabName !== 'onboarding') {
        renderOnboarding();
        return;
      }

      switch (tabName) {
        case 'home':
          renderHome();
          break;
        case 'learn':
          renderRoadmap();
          break;
        case 'practice':
          renderPracticeCenter();
          break;
        case 'ai-tutor':
          renderAITutor();
          break;
        case 'profile':
          renderProfile();
          break;
        default:
          renderHome();
      }
      window.scrollTo(0, 0);
    }

      e.preventDefault();
      currentUser.name = document.getElementById('obName').value.trim();
      currentUser.priorKnowledge = document.getElementById('obPrior').value;
      currentUser.goal = document.getElementById('obGoal').value;
      currentUser.dailyMinutes = document.getElementById('obTime').value;
      saveUserState();
      switchTab('home');
    }

    function handleAIChat(e) {
      e.preventDefault();
      const input = document.getElementById('aiInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      // User Message
      chatBox.innerHTML += `
        <div class="ml-auto bg-gray-100 dark:bg-gray-700 p-3 rounded-2xl max-w-[85%] text-xs text-right">
          <p class="text-gray-900 dark:text-white">${text}</p>
        </div>
      `;

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Simulated AI response
      setTimeout(() => {
        let reply = "Perkataan ini sangat kerap digunakan dalam HSK 1! Belajar membaca Pinyin dan mengamalkan sebutan audio setiap hari.";
        if (text.toLowerCase().includes("suka") || text.toLowerCase().includes("喜欢")) {
          reply = "Perkataan 'suka' dalam Mandarin ialah 喜欢 (xǐhuan). Contoh: 我喜欢喝茶 (Wǒ xǐhuan hē chá - Saya suka minum teh).";
        } else if (text.toLowerCase().includes("terima kasih")) {
          reply = "'Terima kasih' ialah 谢谢 (xièxie). Anda boleh membalas dengan 不客气 (bú kèqi - sama-sama).";
        }

        chatBox.innerHTML += `
          <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-1">
            <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
            <p class="text-gray-800 dark:text-gray-200">${reply}</p>
          </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 600);
    }

    // --- PROFILE & SETTINGS ---
    function renderProfile() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-100 dark:border-gray-700 text-center space-y-3 shadow-sm">
            <div class="w-20 h-20 bg-red-100 dark:bg-red-900/40 text-red-600 rounded-full text-3xl font-black flex items-center justify-center mx-auto">
              ${currentUser.name ? currentUser.name[0].toUpperCase() : 'P'}
            </div>
            <div>
              <h2 class="text-xl font-black text-gray-900 dark:text-white">${currentUser.name}</h2>
              <p class="text-xs text-gray-500">${currentUser.role} • Matlamat: ${currentUser.goal}</p>
            </div>
          </div>

          <!-- SETTINGS -->
          <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl border border-gray-100 dark:border-gray-700 space-y-4 shadow-sm">
            <h3 class="font-bold text-gray-900 dark:text-white text-sm uppercase tracking-wider">Tetapan Aplikasi</h3>

            <div class="flex justify-between items-center py-2 border-b border-gray-100 dark:border-gray-700">
              <span class="text-sm text-gray-700 dark:text-gray-300 font-medium">Kelajuan Audio Suara</span>
              <select onchange="audioSpeed = parseFloat(this.value)" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 rounded-xl font-bold">
                <option value="1.0" selected>Normal (1.0x)</option>
                <option value="0.7">Perlahan (0.7x)</option>
              </select>
            </div>

            <button onclick="resetAppProgress()" class="w-full py-3 bg-red-50 text-red-600 font-bold rounded-2xl text-xs hover:bg-red-100">
              Sifarkan Progress & Reset Semula 🔄
            </button>
          </div>
        </div>
      `;
    }

    function resetAppProgress() {
      if (confirm("Adakah anda pasti mahu menetapkan semula semua rekod pembelajaran?")) {
        localStorage.removeItem('easyhsk_user');
        location.reload();
      }
    }

    // ----------------------------------------------------
    // 7. INITIAL STARTUP
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderStats();
      if (!currentUser.name) {
        renderOnboarding();
      } else {
        switchTab('home');
      }
    });
  </script>
</body>
</html>
