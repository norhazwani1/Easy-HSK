    // ----------------------------------------------------
    // 4. AUDIO SYSTEM
    // ----------------------------------------------------
    function speakMandarin(text, speed = audioSpeed) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = speed;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Sistem audio tidak disokong pada pelayar ini.");
      }
    }

    // ----------------------------------------------------
    // 5. NAVIGATION
    // ----------------------------------------------------
    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-red-600');
        btn.classList.add('text-gray-400');
      });
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-400');
        activeBtn.classList.add('text-red-600');
      }

      if (!currentUser.name && tabName !== 'onboarding') {
        renderOnboarding();
        return;
      }

      switch (tabName) {
        case 'home':
          renderHome();
          break;
        case 'learn':
          renderRoadmap();
          break;
        case 'practice':
          renderPracticeCenter();
          break;
        case 'ai-tutor':
          renderAITutor();
          break;
        case 'profile':
          renderProfile();
          break;
        default:
          renderHome();
      }
      window.scrollTo(0, 0);
    }

            </button>

            <button onclick="startVocabularyQuiz()" class="p-5 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-3xl shadow-sm text-left flex items-center space-x-4 hover:border-red-500 transition-all">
              <span class="p-4 bg-red-100 text-red-600 rounded-2xl text-2xl">📝</span>
              <div>
                <h3 class="font-bold text-gray-900 dark:text-white">Kuiz Kosakata HSK 1</h3>
                <p class="text-xs text-gray-500">Soalan aneka pilihan kosa kata PDF</p>
              </div>
            </button>
          </div>
        </div>
      `;
    }

    // --- VOCABULARY QUIZ LOGIC ---
    function startVocabularyQuiz() {
      const randomWord = hskVocab[Math.floor(Math.random() * hskVocab.length)];
      const main = document.getElementById('mainContent');
      
      main.innerHTML = `
        <div class="space-y-6 max-w-md mx-auto">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-gray-400">KUIZ KOSA KATA</span>
            <button onclick="switchTab('practice')" class="text-sm font-bold text-red-600">Batal</button>
          </div>

          <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-sm text-center space-y-4">
            <p class="text-xs text-gray-500">Apakah maksud bagi perkataan Mandarin berikut?</p>
            <h2 class="text-4xl font-black text-gray-900 dark:text-white">${randomWord.hanzi}</h2>
            <p class="text-lg font-bold text-red-500">${randomWord.pinyin}</p>

            <div class="space-y-2 pt-4">
              ${hskVocab.slice(0, 3).concat(randomWord).sort(() => Math.random() - 0.5).map(opt => `
                <button onclick="handleQuizAnswer('${opt.malay}', '${randomWord.malay}', '${randomWord.hanzi}')" class="w-full py-3 px-4 bg-gray-50 dark:bg-gray-700 hover:bg-red-50 text-gray-800 dark:text-gray-100 font-bold rounded-xl border border-gray-200 dark:border-gray-600 text-sm text-left">
                  ${opt.malay}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function handleQuizAnswer(selected, correct, wordHanzi) {
      if (selected === correct) {
        currentUser.xp += 10;
        currentUser.hskReadiness = Math.min(100, currentUser.hskReadiness + 2);
        saveUserState();
        alert("Bagus! 🎉 Jawapan anda tepat.");
      } else {
        currentUser.mistakes.push({ word: wordHanzi, correctMalay: correct });
        saveUserState();
        alert(`Belum tepat 😊 Jawapan betul ialah: ${correct}`);
      }
      startVocabularyQuiz();
    }

    // --- AI TUTOR ---
    function renderAITutor() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-4 flex flex-col h-[80vh]">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">🤖</span>
            <div>
              <h2 class="text-xl font-black text-gray-900 dark:text-white">AI Guru Mandarin</h2>
              <p class="text-xs text-gray-500">Tanya soalan berkaitan HSK 1 v3.0 & Mandarin</p>
            </div>
          </div>

          <div id="chatBox" class="flex-1 bg-white dark:bg-gray-800 rounded-3xl border border-gray-100 dark:border-gray-700 p-4 overflow-y-auto space-y-3 shadow-inner">
            <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-1">
              <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
              <p class="text-gray-800 dark:text-gray-200">Ni hao! Saya guru AI anda. Ada sebarang soalan tentang pembinaan ayat atau kosa kata HSK 1?</p>
            </div>
          </div>

          <form onsubmit="handleAIChat(event)" class="flex space-x-2">
            <input type="text" id="aiInput" placeholder="Taip soalan anda di sini..." class="flex-1 px-4 py-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
            <button type="submit" class="px-5 py-3 bg-red-600 text-white font-bold rounded-2xl">Hantar</button>
          </form>
        </div>
      `;
    }

    function handleAIChat(e) {
      e.preventDefault();
      const input = document.getElementById('aiInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      chatBox.innerHTML += `
        <div class="ml-auto bg-gray-100 dark:bg-gray-700 p-3 rounded-2xl max-w-[85%] text-xs text-right">
          <p class="text-gray-900 dark:text-white">${text}</p>
        </div>
      `;

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        let reply = "Sistem tatabahasa HSK 1 versi 3.0 mengandungi susunan asas Subjek + Kata Kerja + Objek. Teruskan latihan setiap hari!";
        if (text.toLowerCase().includes("suka") || text.toLowerCase().includes("爱")) {
          reply = "Perkataan 'suka/cinta' dalam HSK 1 ialah 爱 (ài). Contoh: 我爱吃包子 (Wǒ ài chī bāozi - Saya suka makan pau).";
        }

        chatBox.innerHTML += `
          <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-1">
            <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
            <p class="text-gray-800 dark:text-gray-200">${reply}</p>
          </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 600);
    }

    // --- PROFILE & SETTINGS ---
    function renderProfile() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-100 dark:border-gray-700 text-center space-y-3 shadow-sm">
            <div class="w-20 h-20 bg-red-100 dark:bg-red-900/40 text-red-600 rounded-full text-3xl font-black flex items-center justify-center mx-auto">
              ${currentUser.name ? currentUser.name[0].toUpperCase() : 'P'}
            </div>
            <div>
              <h2 class="text-xl font-black text-gray-900 dark:text-white">${currentUser.name}</h2>
              <p class="text-xs text-gray-500">${currentUser.role} • Matlamat: ${currentUser.goal}</p>
            </div>
          </div>

          <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl border border-gray-100 dark:border-gray-700 space-y-4 shadow-sm">
            <h3 class="font-bold text-gray-900 dark:text-white text-sm uppercase tracking-wider">Tetapan Aplikasi</h3>

            <div class="flex justify-between items-center py-2 border-b border-gray-100 dark:border-gray-700">
              <span class="text-sm text-gray-700 dark:text-gray-300 font-medium">Kelajuan Audio Suara</span>
              <select onchange="audioSpeed = parseFloat(this.value)" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 rounded-xl font-bold">
                <option value="1.0" selected>Normal (1.0x)</option>
                <option value="0.7">Perlahan (0.7x)</option>
              </select>
            </div>

            <button onclick="resetAppProgress()" class="w-full py-3 bg-red-50 text-red-600 font-bold rounded-2xl text-xs hover:bg-red-100">
              Sifarkan Progress & Reset Semula 🔄
            </button>
          </div>
        </div>
      `;
    }

    function resetAppProgress() {
      if (confirm("Adakah anda pasti mahu menetapkan semula semua rekod pembelajaran?")) {
        localStorage.removeItem('easyhsk_user');
        location.reload();
      }
    }

    // ----------------------------------------------------
    // 7. INITIAL STARTUP
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderStats();
      if (!currentUser.name) {
        renderOnboarding();
      } else {
        switchTab('home');
      }
    });
  </script>
</body>
</html>
