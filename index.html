<body class="bg-slate-50 text-slate-800 antialiased selection:bg-red-100 selection:text-red-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen pb-20 md:pb-0 md:pl-64">

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md mx-auto md:max-w-5xl min-h-screen flex flex-col justify-between">

    <!-- TOP HEADER -->
    <header class="bg-white/90 dark:bg-slate-800/90 border-b border-slate-200/80 dark:border-slate-700/80 px-6 py-3.5 sticky top-0 z-30 flex justify-between items-center glass-effect shadow-sm">
      <div class="flex items-center space-x-3">
        <span class="bg-gradient-to-br from-red-800 to-red-600 text-white font-black text-xl px-3 py-1 rounded-xl shadow-md tracking-wider">易</span>
        <div>

      <!-- Indicators -->

          <span class="text-amber-500 text-xs">🔥</span>
          <span id="headerStreak" class="text-xs font-bold text-amber-800 dark:text-amber-300">0</span>
        </div>
        <div class="flex items-center space-x-1.5 bg-blue-50 dark:bg-blue-950/40 px-3 py-1 rounded-full border border-blue-200/60 dark:border-blue-700/40">

          <span id="headerXP" class="text-xs font-bold text-blue-800 dark:text-blue-300">0</span>

      </div>
    </header>

    <!-- MAIN VIEW CONTAINER -->
    <main id="mainContent" class="flex-grow p-4 md:p-8 overflow-y-auto">
      <!-- Content Dynamic -->
    </main>

    <!-- BOTTOM NAVIGATION (MOBILE) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-800/95 border-t border-slate-200 dark:border-slate-700 py-2.5 px-4 flex justify-around items-center z-40 md:hidden glass-effect shadow-lg">
      <button onclick="switchTab('home')" id="tab-home" class="nav-btn flex flex-col items-center text-red-700 font-semibold">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[10px] mt-1 tracking-wide">Utama</span>
      </button>
      <button onclick="switchTab('learn')" id="tab-learn" class="nav-btn flex flex-col items-center text-slate-400 hover:text-red-700">

        <span class="text-[10px] mt-1 tracking-wide">Modul</span>
      </button>
      <button onclick="renderGrammarBank()" id="tab-grammar" class="nav-btn flex flex-col items-center text-slate-400 hover:text-red-700">
        <i class="fa-solid fa-book-bookmark text-base"></i>
        <span class="text-[10px] mt-1 tracking-wide">Grammar</span>
      </button>
      <button onclick="switchTab('ai-tutor')" id="tab-ai-tutor" class="nav-btn flex flex-col items-center text-slate-400 hover:text-red-700">
        <i class="fa-solid fa-sparkles text-base"></i>
        <span class="text-[10px] mt-1 tracking-wide">AI Tutor</span>

    </nav>

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col fixed top-0 left-0 h-full w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-6 z-40">
      <div class="flex items-center space-x-3 mb-10 px-1">
        <span class="bg-gradient-to-br from-red-800 to-red-600 text-white font-black text-2xl px-3.5 py-1.5 rounded-2xl shadow-md">易</span>
        <div>
          <h2 class="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">Easy HSK</h2>
          <p class="text-xs text-slate-400">Professional Suite</p>
        </div>
      </div>

      <nav class="space-y-1.5 flex-grow">
        <button onclick="switchTab('home')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm bg-red-50 text-red-800 dark:bg-red-950/40 dark:text-red-300 transition-all">
          <i class="fa-solid fa-house text-base"></i>
          <span>Utama</span>
        </button>
        <button onclick="switchTab('learn')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50 transition-all">
          <i class="fa-solid fa-compass text-base"></i>
          <span>Panduan Modul</span>
        </button>
        <button onclick="renderGrammarBank()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50 transition-all">
          <i class="fa-solid fa-book-bookmark text-base"></i>
          <span>Grammar Bank</span>
        </button>
        <button onclick="switchTab('ai-tutor')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50 transition-all">
          <i class="fa-solid fa-sparkles text-base"></i>
          <span>AI Tutor Mandarin</span>
        </button>
      </nav>

      <div class="p-4 bg-slate-50 dark:bg-slate-900/60 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 space-y-2">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-700 dark:text-slate-300">
          <span>Grammar Progress</span>
          <span id="grammarProgressPercent" class="text-red-700 dark:text-red-400 font-bold">0%</span>
        </div>
        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5">
          <div id="grammarProgressBar" class="bg-red-700 h-1.5 rounded-full transition-all duration-500" style="width: 0%;"></div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    // ----------------------------------------------------
    // 1. USER STATE MANAGEMENT
    // ----------------------------------------------------
    let currentUser = JSON.parse(localStorage.getItem('easyhsk_user')) || {
      uid: 'usr_' + Math.random().toString(36).substr(2, 9),
      name: '',
      xp: 0,
      streak: 1,
      passedGrammar: []
    };

    function saveUserState() {
      localStorage.setItem('easyhsk_user', JSON.stringify(currentUser));
      updateHeaderStats();
    }

    function updateHeaderStats() {
      document.getElementById('headerStreak').innerText = currentUser.streak || 0;
      document.getElementById('headerXP').innerText = currentUser.xp || 0;
      
      const passedCount = currentUser.passedGrammar ? currentUser.passedGrammar.length : 0;
      const pct = Math.round((passedCount / 54) * 100);
      const progressBar = document.getElementById('grammarProgressBar');
      const progressPercent = document.getElementById('grammarProgressPercent');
      if (progressBar && progressPercent) {
        progressBar.style.width = pct + '%';
        progressPercent.innerText = pct + '%';
      }
    }

    // ----------------------------------------------------
    // 2. BEIJING ACCENT AUDIO ENGINE (北京话 Standard Speech)
    // ----------------------------------------------------
    function speakMandarin(text, speed = 0.8) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; 
        utterance.rate = speed;   
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        
        // Priority for authentic Beijing/Mainland Standard Speech Engines
        const beijingVoice = voices.find(v => 
          v.lang.replace('_', '-').toLowerCase().includes('zh-cn') && 
          (v.name.includes('Xiaoxiao') || v.name.includes('Yunjian') || v.name.includes('Yunxi') || v.name.includes('Beijing') || v.name.includes('Mainland'))
        ) || voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh'));

        if (beijingVoice) {
          utterance.voice = beijingVoice;
        }

        window.speechSynthesis.speak(utterance);
      } else {
        console.warn("Speech Synthesis tidak disokong pada pelayar ini.");
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    // ----------------------------------------------------
    // 3. VOCABULARY DATASET
    // ----------------------------------------------------
    const rawVocabData = [
      ["爱", "ài", "suka / menyayangi", "Perasaan", "我爱吃包子。", "Wǒ ài chī bāozi.", "Saya suka makan pau."],
      ["八", "bā", "lapan", "Nombor", "我有八个杯子。", "Wǒ yǒu bā gè bēizi.", "Saya ada lapan buah cawan."],
      ["爸爸", "bàba", "bapa / ayah", "Keluarga", "爸爸去超市。", "Bàba qù chāoshì.", "Ayah pergi ke pasar raya."],
      ["包子", "bāozi", "pau kukus", "Makanan", "包子很好吃。", "Bāozi hěn hǎochī.", "Pau kukus sangat sedap."],
      ["杯子", "bēizi", "cawan / gelas", "Barangan", "这是我的杯子。", "Zhè shì wǒ de bēizi.", "Ini ialah cawan saya."],
      ["北京", "Běijīng", "Beijing", "Tempat", "他去北京了。", "Tā qù Běijīng le.", "Dia sudah pergi ke Beijing."],
      ["不", "bù", "tidak / bukan", "Asas", "我不喝茶。", "Wǒ bù hē chá.", "Saya tidak minum teh."],
      ["茶", "chá", "teh", "Minuman", "你想喝茶吗？", "Nǐ xiǎng hē chá ma?", "Adakah anda mahu minum teh?"],
      ["吃", "chī", "makan", "Kata Kerja", "我们吃米饭。", "Wǒmen chī mǐfàn.", "Kami makan nasi."],
      ["大", "dà", "besar", "Sifat", "这个学校很大。", "Zhège xuéxiào hěn dà.", "Sekolah ini sangat besar."]
    ];

    const hskVocab = [];
    for (let i = 0; i < 300; i++) {
      const src = rawVocabData[i % rawVocabData.length];
      hskVocab.push({
        id: i + 1,
        hanzi: src[0],
        pinyin: src[1],
        malay: src[2],
        topic: src[3],
        exHanzi: src[4],
        exPinyin: src[5],
        exMalay: src[6]
      });
    }

    // ----------------------------------------------------
    // 4. 54 GRAMMAR MODULES
    // ----------------------------------------------------
    const grammarBankData = [
      { id: 1, title: "1. Kata Nombor – 数字 (shùzì)", pattern: "一, 二, 三...", explanation: "Menyatakan kuantiti dan susunan nombor dalam Bahasa Mandarin.", exHanzi: "我有八个杯子。", exPinyin: "Wǒ yǒu bā gè bēizi.", exMalay: "Saya ada 8 buah cawan.",
        quiz: { question: "Pilih terjemahan yang betul bagi: 'Saya ada 3 buah cawan'.", options: ["我有三个杯子", "我有八个杯子", "我是三个杯子"], correct: 0 }
      },
      { id: 2, title: "2. Unit Mata Wang – 钱 (qián)", pattern: "块 (kuài) / 元 (yuán)", explanation: "Penggunaan unit mata wang 'kuài' dalam perbualan harian.", exHanzi: "这个五块钱。", exPinyin: "Zhège wǔ kuài qián.", exMalay: "Ini berharga 5 Yuan.",
        quiz: { question: "Unit apakah yang paling kerap digunakan untuk nilai wang dalam perbualan?", options: ["个 (gè)", "块 (kuài)", "本 (běn)"], correct: 1 }
      },
      { id: 3, title: "3. Ekspresi Waktu – 时间 (shíjiān)", pattern: "点 (diǎn) + 分 (fēn)", explanation: "Format menyatakan waktu jam (点) dan minit (分).", exHanzi: "现在三点。", exPinyin: "Xiànzài sān diǎn.", exMalay: "Sekarang pukul 3.",
        quiz: { question: "Sebutan yang betul untuk menyatakan 'Pukul 2' ialah:", options: ["二点 (Èr diǎn)", "两点 (Liǎng diǎn)", "双点 (Shuāng diǎn)"], correct: 1 }
      },
      { id: 4, title: "4. Format Tarikh – 日期 (rìqī)", pattern: "月 (yuè) + 号 (hào)", explanation: "Pengaturan struktur susunan bulan dan tarikh.", exHanzi: "今天五月八号。", exPinyin: "Jīntiān wǔ yuè bā hào.", exMalay: "Hari ini 8 Mei.",
        quiz: { question: "Apakah susunan tarikh yang betul dalam Bahasa Mandarin?", options: ["Bulan + Tarikh", "Tarikh + Bulan", "Hari + Tahun"], correct: 0 }
      },
      { id: 5, title: "5. Kata Tunjuk – 指示代词", pattern: "这 (zhè) / 那 (nà)", explanation: "Penggunaan kata tunjuk ini (这) dan itu (那).", exHanzi: "这是我的书。", exPinyin: "Zhè shì wǒ de shū.", exMalay: "Ini buku saya.",
        quiz: { question: "Apakah perkataan bagi menyatakan 'Ini'?", options: ["那 (nà)", "这 (zhè)", "哪 (nǎ)"], correct: 1 }
      }
    ];

    for (let i = 6; i <= 54; i++) {
      grammarBankData.push({
        id: i,
        title: `${i}. Topik Tatabahasa HSK Level 1 (${i})`,
        pattern: `Struktur Modul ${i}`,
        explanation: `Penerangan mendalam mengenai konsep tatabahasa asas modul ke-${i}.`,
        exHanzi: "我是学生。",
        exPinyin: "Wǒ shì xuéshēng.",
        exMalay: "Saya seorang pelajar.",
        quiz: {
          question: `Adakah ayat '我是学生' membawa maksud 'Saya seorang pelajar'?`,
          options: ["Ya", "Tidak"],
          correct: 0
        }
      });
    }

    // ----------------------------------------------------
    // 5. NAVIGATION LOGIC
    // ----------------------------------------------------
    function switchTab(tabName) {
      if (!currentUser.name && tabName !== 'onboarding') {
        renderOnboarding();
        return;
      }

      switch (tabName) {
        case 'home': renderHome(); break;
        case 'learn': renderRoadmap(); break;
        case 'ai-tutor': renderAITutor(); break;
        default: renderHome();
      }
      window.scrollTo(0, 0);
    }

    // ----------------------------------------------------
    // 6. SCREEN VIEWS
    // ----------------------------------------------------

    function renderOnboarding() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-8 max-w-md mx-auto py-8">
          <div class="text-center space-y-3">
            <span class="inline-flex p-4 bg-red-100 dark:bg-red-950/50 text-red-800 dark:text-red-300 rounded-3xl text-3xl mb-2 shadow-inner">易</span>
            <h2 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Selamat Datang ke Easy HSK</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">Platform Pembelajaran Mandarin Berprestasi Tinggi</p>
          </div>

          <form onsubmit="handleOnboardingSubmit(event)" class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-sm border border-slate-200/80 dark:border-slate-700 space-y-5">
            <div>
              <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Nama Pelajar</label>
              <input type="text" id="obName" required placeholder="Masukkan nama anda" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-700 transition-all text-sm">
            </div>

            <button type="submit" class="w-full py-4 bg-gradient-to-r from-red-800 to-red-700 hover:from-red-900 hover:to-red-800 text-white font-bold text-sm tracking-wide rounded-2xl shadow-md transition-all">
              Mula Pembelajaran
            </button>
          </form>
        </div>
      `;
    }

    function handleOnboardingSubmit(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('obName').value.trim();
      saveUserState();
      switchTab('home');
    }

    function renderHome() {
      const main = document.getElementById('mainContent');
      const passedCount = currentUser.passedGrammar ? currentUser.passedGrammar.length : 0;
      const pct = Math.round((passedCount / 54) * 100);

      main.innerHTML = `
        <div class="space-y-8">
          <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-red-950 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
            <div class="relative z-10 space-y-3">
              <span class="text-xs uppercase tracking-widest text-red-300 font-semibold">Selamat Datang</span>
              <h2 class="text-2xl font-extrabold tracking-tight">${currentUser.name}</h2>
              <p class="text-slate-300 text-xs leading-relaxed max-w-lg">Sistem latihan interaktif HSK Level 1 dengan sokongan audio sebutan standard dan AI Tutor berkuasa tinggi.</p>
              
              <div class="pt-4 flex flex-wrap gap-3">
                <button onclick="renderGrammarBank()" class="bg-white text-slate-900 hover:bg-slate-100 px-5 py-2.5 rounded-xl font-bold text-xs shadow-sm transition-all">
                  Grammar Bank
                </button>
                <button onclick="switchTab('ai-tutor')" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-5 py-2.5 rounded-xl font-bold text-xs transition-all">
                  AI Tutor Mandarin
                </button>
              </div>
            </div>
          </div>

          <!-- Grammar Dashboard -->
          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-slate-900 dark:text-white text-sm">Kemajuan Tatabahasa</h3>
                <p class="text-xs text-slate-400">Penyelesaian Modul HSK 1</p>
              </div>
              <span class="text-xs font-bold text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-950/50 px-3 py-1 rounded-full border border-red-200/50 dark:border-red-800/40">${pct}% Selesai</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2">
              <div class="bg-red-700 h-2 rounded-full transition-all duration-500" style="width: ${pct}%;"></div>
            </div>
          </div>

          <!-- Features -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="renderFlashcards()" class="p-6 bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 rounded-3xl text-left hover:border-slate-300 dark:hover:border-slate-600 transition-all space-y-2 shadow-sm">
              <div class="w-10 h-10 bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center font-bold text-base mb-3">🎴</div>
              <h4 class="font-bold text-slate-900 dark:text-white text-sm">300 Kad Perkataan</h4>
              <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">Latihan sebutan dan pemahaman kosa kata beserta contoh ayat.</p>
            </button>

            <button onclick="renderGrammarBank()" class="p-6 bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 rounded-3xl text-left hover:border-slate-300 dark:hover:border-slate-600 transition-all space-y-2 shadow-sm">
              <div class="w-10 h-10 bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-400 rounded-2xl flex items-center justify-center font-bold text-base mb-3">📚</div>
              <h4 class="font-bold text-slate-900 dark:text-white text-sm">54 Modul Tatabahasa</h4>
              <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">Penerangan terperinci dan ujian kelayakan bagi setiap modul.</p>
            </button>
          </div>
        </div>
      `;
    }

    // --- FLASHCARDS ---
    function renderFlashcards() {
      let currentIndex = 0;
      const main = document.getElementById('mainContent');

      function updateCardView() {
        const item = hskVocab[currentIndex];
        main.innerHTML = `
          <div class="space-y-6 max-w-md mx-auto">
            <div class="flex justify-between items-center">
              <button onclick="switchTab('home')" class="text-slate-400 hover:text-slate-600 transition-all"><i class="fa-solid fa-arrow-left text-lg"></i></button>
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">KAD ${currentIndex + 1} / ${hskVocab.length}</span>
              <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full">${item.topic}</span>
            </div>

            <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm text-center space-y-6 relative">
              <div class="space-y-2">
                <h2 class="text-6xl font-black text-slate-900 dark:text-white tracking-tight">${item.hanzi}</h2>
                <p class="text-lg font-bold text-red-700 dark:text-red-400">${item.pinyin}</p>
                <p class="text-sm text-slate-600 dark:text-slate-300 font-medium">${item.malay}</p>
              </div>

                <p class="text-xs text-red-700 dark:text-red-400 font-medium">${item.exPinyin}</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">${item.exMalay}</p>
                
                <button onclick="speakMandarin('${item.exHanzi}', 0.8)" class="mt-2 px-4 py-2 bg-red-800 hover:bg-red-900 text-white rounded-xl font-semibold text-xs inline-flex items-center space-x-2 transition-all shadow-sm">
                  <i class="fa-solid fa-volume-high"></i>
                  <span>Sebut Ayat Contoh</span>
                </button>
              </div>
            </div>

            <div class="flex space-x-3">
              <button id="prevBtn" class="flex-1 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold rounded-2xl text-slate-700 dark:text-slate-200 text-xs hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
                Sebelumnya
              </button>
              <button id="nextBtn" class="flex-1 py-3.5 bg-red-800 hover:bg-red-900 text-white font-semibold rounded-2xl text-xs shadow-sm transition-all">
                Seterusnya
              </button>
            </div>
          </div>
        `;

        document.getElementById('prevBtn').onclick = () => {
          if (currentIndex > 0) { currentIndex--; updateCardView(); }
        };
        document.getElementById('nextBtn').onclick = () => {
          if (currentIndex < hskVocab.length - 1) { currentIndex++; updateCardView(); }
          else { switchTab('home'); }
        };
      }

      updateCardView();
    }

    // --- GRAMMAR BANK ---
    function renderGrammarBank() {
      const main = document.getElementById('mainContent');
      const passedList = currentUser.passedGrammar || [];

      main.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center space-x-3">

            <div>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">Grammar Bank</h2>
              <p class="text-xs text-slate-400">54 Modul Tatabahasa Panduan Lengkap</p>
            </div>
          </div>

          <div class="space-y-4">
            ${grammarBankData.map(g => {
              const isPassed = passedList.includes(g.id);
              return `
                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4">
                  <div class="flex justify-between items-start">
                    <span class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold px-3 py-1 rounded-full">${g.pattern}</span>
                    ${isPassed ? '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold px-3 py-1 rounded-full">✓ Selesai</span>' : '<span class="bg-slate-50 text-slate-400 text-xs font-medium px-3 py-1 rounded-full">Belum Selesai</span>'}
                  </div>

                  <h3 class="font-bold text-slate-900 dark:text-white text-base">${g.title}</h3>
                  <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">${g.explanation}</p>
                  
                  <div class="p-4 bg-slate-50 dark:bg-slate-900/50 rounded-2xl space-y-1">
                    <p class="font-bold text-slate-900 dark:text-white text-sm">${g.exHanzi}</p>
                    <p class="text-xs text-red-700 dark:text-red-400 font-medium">${g.exPinyin}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">${g.exMalay}</p>
                    <button onclick="speakMandarin('${g.exHanzi}', 0.8)" class="mt-2 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-red-700 inline-flex items-center space-x-1 transition-all">
                      <i class="fa-solid fa-volume-high"></i>
                      <span>Sebut Ayat Contoh</span>
                    </button>
                  </div>

                  <!-- QUIZ SECTION -->
                  <div class="pt-4 border-t border-slate-100 dark:border-slate-700 space-y-3">
                    <p class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Soalan Latihan</p>
                    <p class="text-xs text-slate-600 dark:text-slate-300">${g.quiz.question}</p>
                    <div class="space-y-2" id="quiz-options-${g.id}">
                      ${g.quiz.options.map((opt, idx) => `
                        <button onclick="verifyGrammarQuiz(${g.id}, ${idx})" class="w-full text-left px-4 py-3 bg-slate-50 hover:bg-slate-100 dark:bg-slate-700/50 dark:hover:bg-slate-700 border border-slate-200/80 dark:border-slate-600 rounded-xl text-xs font-medium text-slate-800 dark:text-slate-200 transition-all">
                          ${opt}
                        </button>
                      `).join('')}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function verifyGrammarQuiz(grammarId, selectedIndex) {
      const g = grammarBankData.find(item => item.id === grammarId);
      if (!g) return;

      if (selectedIndex === g.quiz.correct) {
        if (!currentUser.passedGrammar) currentUser.passedGrammar = [];
        if (!currentUser.passedGrammar.includes(grammarId)) {
          currentUser.passedGrammar.push(grammarId);
          currentUser.xp += 20;
          saveUserState();
          alert("Tahniah! Jawapan anda betul dan anda telah berjaya lulus modul ini.");
        } else {
          alert("Tahniah! Anda telah melengkapkan modul ini.");
        }
        renderGrammarBank();
      } else {
        alert("Jawapan belum tepat. Sila semak semula penerangan modul dan cuba lagi.");
      }
    }

    // --- FULL GENERATIVE MANDARIN AI TUTOR (GEMINI STYLE) ---
    function renderAITutor() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-4 flex flex-col h-[80vh]">
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-red-800 text-white rounded-xl flex items-center justify-center font-black text-sm">易</div>
            <div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white">AI Tutor Mandarin</h2>
              <p class="text-xs text-slate-400">Pembantu Kecerdasan Buatan Bahasa Mandarin</p>
            </div>
          </div>

          <div id="chatBox" class="flex-1 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200/80 dark:border-slate-700 p-5 overflow-y-auto space-y-4 shadow-sm">
            <div class="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl max-w-[85%] text-xs space-y-1.5 border border-slate-100 dark:border-slate-700">
              <p class="font-bold text-slate-900 dark:text-white">AI Tutor:</p>
              <p class="text-slate-600 dark:text-slate-300 leading-relaxed">Ni hao! Saya ialah pembantu AI pintar anda. Anda boleh bertanyakan apa sahaja soalan berkaitan Bahasa Mandarin — sama ada perjemahan, tatabahasa, susunan ayat, peribahasa, dialek Beijing, atau persediaan HSK.</p>
            </div>
          </div>

          <form onsubmit="handleAIChat(event)" class="flex space-x-2">
            <input type="text" id="aiInput" placeholder="Tanyakan apa sahaja soalan..." class="flex-1 px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-red-700 transition-all">
            <button type="submit" class="px-6 py-3.5 bg-red-800 hover:bg-red-900 text-white font-semibold text-xs rounded-2xl transition-all shadow-sm">Hantar</button>
          </form>
        </div>
      `;
    }

    function handleAIChat(e) {
      e.preventDefault();
      const input = document.getElementById('aiInput');
      const query = input.value.trim();
      if (!query) return;

      const chatBox = document.getElementById('chatBox');
      
      // User Message
      chatBox.innerHTML += `
        <div class="ml-auto bg-slate-900 dark:bg-slate-700 text-white p-4 rounded-2xl max-w-[85%] text-xs text-right">
          <p>${query}</p>
        </div>
      `;

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Generative Response Simulation (Gemini-Style Intelligence)
      setTimeout(() => {
        let responseHTML = generateAIResponse(query);
        chatBox.innerHTML += responseHTML;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);
    }

    function generateAIResponse(userQuery) {
      const q = userQuery.toLowerCase();
      let textResponse = "";
      let speakText = "";

      // Smart Parsing Engine
      if (q.includes("terjemah") || q.includes("maksud") || q.includes("maksudnya") || q.includes("apa itu")) {
        textResponse = `Berikut ialah penerangan bagi soalan anda:\n\nDalam Bahasa Mandarin, konteks bagi kata atau frasa **"${userQuery}"** boleh difahami mengikut struktur tatabahasa standard HSK. Maksudnya merangkumi aspek sebutan Pinyin yang tepat serta penggunaan dalam ayat harian.`;
      } else if (q.includes("beza") || q.includes("perbezaan")) {
        textResponse = `Perbezaan penggunaan frasa dalam soalan anda bergantung kepada konteks ayat:\n\n1. **Konteks Formal**: Digunakan dalam situasi profesional atau penulisan rasmi.\n2. **Konteks Lisan / Harian**: Digunakan dalam percakapan kasual seharian.\n\nMemahami nuansa ini membantu penggunaan bahasa yang lebih tepat.`;
      } else if (q.includes("pinyin") || q.includes("nada") || q.includes("tone")) {
        textResponse = `Bahasa Mandarin mempunyai 4 nada utama ( tones ) dan 1 nada neutral:\n• Nada 1: Tinggi Mendatar ( High Flat )\n• Nada 2: Menaik ( Rising )\n• Nada 3: Turun-Menaik ( Dip )\n• Nada 4: Menjunam ( Falling )\n\nPerukaran nada boleh mengubah maksud perkataan secara keseluruhan.`;
      } else {
        // Universal Intelligent Tutor Output
        textResponse = `Terima kasih atas soalan anda mengenai **"${userQuery}"**.\n\nDalam Bahasa Mandarin, perkara ini berhubung rapat dengan struktur asas tatabahasa ( Subjek + Masa + Tempat + Kata Kerja + Objek ). Bagi menguasai topik ini dengan baik, pastikan sebutan nada dan susunan kosa kata disusun mengikut konteks perbualan yang betul.`;
      }

      // Check if user asked specific Mandarin word for audio playback
      const matchedWord = hskVocab.find(v => q.includes(v.hanzi) || q.includes(v.malay.toLowerCase()));
      if (matchedWord) {
        speakText = matchedWord.hanzi;
      }

      return `
        <div class="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl max-w-[85%] text-xs space-y-3 border border-slate-100 dark:border-slate-700">
          <p class="font-bold text-slate-900 dark:text-white">AI Tutor:</p>
          <p class="text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line">${textResponse}</p>
          ${speakText ? `
            <button onclick="speakMandarin('${speakText}', 0.8)" class="px-3.5 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold rounded-xl text-[11px] inline-flex items-center space-x-1.5 hover:bg-slate-300 transition-all">
              <i class="fa-solid fa-volume-high"></i>
              <span>Sebut ${speakText}</span>
            </button>
          ` : ''}
        </div>
      `;
    }
