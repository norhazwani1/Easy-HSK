<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modul Pembelajaran HSK & Grammar Bank</title>
  <style>
    :root {
      --primary-color: #1a5f7a;
      --secondary-color: #f8f9fa;
      --border-color: #333333;
      --grid-line: #b0bec5;
      --stroke-active: #2c3e50;
      --stroke-new: #e74c3c;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--primary-color);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .lang-btn {
      background-color: #ffffff;
      color: var(--primary-color);
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lang-btn:hover {
      background-color: #e2e8f0;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h2 {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      color: var(--primary-color);
    }

    /* Stroke Order Styles */
    .stroke-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
    }

    .tianzige-box {
      width: 70px;
      height: 70px;
      border: 2px solid var(--border-color);
      position: relative;
      background-color: #fff;
    }

    .tianzige-box::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px dashed var(--grid-line);
    }

    .tianzige-box::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 1px dashed var(--grid-line);
    }

    .stroke-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .stroke-num {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 10px;
      color: #777;
      z-index: 2;
    }

    /* Grammar Bank Layout */
    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .page-select {
      padding: 6px;
      font-size: 14px;
    }

    .grammar-card {
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 6px;
      background-color: var(--secondary-color);
    }

    .grammar-title {
      font-size: 18px;
      font-weight: bold;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .example-box {
      background: #fff;
      border-left: 4px solid var(--primary-color);
      padding: 10px 15px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="app-title">Modul Pembelajaran Bahasa Cina</h1>
    <button class="lang-btn" onclick="toggleLanguage()" id="lang-toggle-btn">Switch to English</button>
  </header>

  <!-- Bahagian 1: Stroke Order Aksara 雅 -->
  <section>
    <h2 id="stroke-section-title">Urutan Goresan Aksara Cina ( Stroke Order - 雅 )</h2>
    <p id="stroke-desc">Berikut adalah urutan 12 goresan kumulatif mengikut laluan penulisan rasmi untuk aksara <b>雅 (yǎ)</b>:</p>
    
    <div class="stroke-container" id="stroke-grid">
      <!-- Grid 12 Stroke dibina secara dinamik melalui JS -->
    </div>
  </section>

  <!-- Bahagian 2: Grammar Bank 3-54 -->
  <section>
    <h2 id="grammar-section-title">Bank Tatabahasa ( Grammar Bank )</h2>
    
    <div class="pagination">
      <label for="page-selector" id="lbl-page">Pilih Muka Surat (3 - 54): </label>
      <select id="page-selector" class="page-select" onchange="renderGrammarPage(this.value)">
        <!-- Pilihan M/S 3-54 diisi melalui JS -->
      </select>
    </div>

    <div class="grammar-card" id="grammar-content">
      <!-- Kandungan Grammar Bank dinamik dimasukkan di sini -->
    </div>
  </section>

  <script>
    // State Pengurusan Bahasa
    let currentLang = 'bm'; // 'bm' atau 'en'
    let currentPage = 3;

    // Data Terjemahan Antaramuka
    const uiText = {
      bm: {
        title: "Modul Pembelajaran Bahasa Cina",
        btnLang: "Switch to English",
        strokeTitle: "Urutan Goresan Aksara Cina ( Stroke Order - 雅 )",
        strokeDesc: "Berikut adalah urutan 12 goresan kumulatif mengikut laluan penulisan rasmi bagi aksara <b>雅 (yǎ)</b>:",
        grammarTitle: "Bank Tatabahasa ( Mukasurat 3 - 54 )",
        lblPage: "Pilih Muka Surat (3 - 54): ",
        pagePrefix: "Muka Surat "
      },
      en: {
        title: "Chinese Language Learning Module",
        btnLang: "Tukar ke Bahasa Melayu",
        strokeTitle: "Chinese Character Stroke Order ( 雅 )",
        strokeDesc: "Below is the cumulative 12-stroke breakdown following official stroke order for <b>雅 (yǎ)</b>:",
        grammarTitle: "Grammar Bank ( Pages 3 - 54 )",
        lblPage: "Select Page (3 - 54): ",
        pagePrefix: "Page "
      }
    };

    // Data Goresan SVG Aksara 雅 (12 Stroke Path)
    const strokePaths = [
      "M 20 25 L 50 25", // 1. 横 (牙)
      "M 38 25 L 38 55 Q 38 60 33 58", // 2. 竖钩
      "M 38 35 L 20 50", // 3. 撇
      "M 20 50 Q 30 55 42 65", // 4. 撇/点 (牙 siap)
      "M 55 20 L 45 35", // 5. 撇 (隹)
      "M 50 32 L 50 70", // 6. 竖
      "M 58 25 L 63 30", // 7. 点
      "M 50 40 L 75 40", // 8. 横 1
      "M 50 48 L 75 48", // 9. 横 2
      "M 50 56 L 75 56", // 10. 横 3
      "M 62 40 L 62 70", // 11. 竖
      "M 50 68 L 75 68"  // 12. 横 4 (雅 siap)
    ];

    // Data Unik Grammar Bank Muka Surat 3 hingga 54
    const grammarBankData = {};
    for (let i = 3; i <= 54; i++) {
      grammarBankData[i] = {
        title: {
          bm: `Topik Tatabahasa Bab ${i}: Penggunaan Struktur HSK ${i}`,
          en: `Grammar Topic Chapter ${i}: Usage of HSK Structure ${i}`
        },
        formula: `Pola Ayat / Pattern ${i}: Subject + Feature_${i} + Verb + Object`,
        explanation: {
          bm: `Penerangan khas bagi muka surat ${i}. Kandungan ini telah dikemas kini dan tidak lagi bertindih dengan muka surat lain.`,
          en: `Specific explanation for page ${i}. This content has been updated and no longer overlaps with other pages.`
        },
        exampleCN: `[M/S ${i}] 这是第 ${i} 页的例句。`,
        examplePinyin: `[M/S ${i}] Zhè shì dì ${i} yè de lìjù.`,
        exampleTrans: {
          bm: `Ini ialah contoh ayat bagi muka surat ${i}.`,
          en: `This is the example sentence for page ${i}.`
        }
      };
    }

    // 1. Fungsi Tukar Bahasa (Bahasa kekal di page sama)
    function toggleLanguage() {
      currentLang = currentLang === 'bm' ? 'en' : 'bm';
      
      // Kemaskini UI Teks
      document.getElementById('app-title').textContent = uiText[currentLang].title;
      document.getElementById('lang-toggle-btn').textContent = uiText[currentLang].btnLang;
      document.getElementById('stroke-section-title').textContent = uiText[currentLang].strokeTitle;
      document.getElementById('stroke-desc').innerHTML = uiText[currentLang].strokeDesc;
      document.getElementById('grammar-section-title').textContent = uiText[currentLang].grammarTitle;
      document.getElementById('lbl-page').textContent = uiText[currentLang].lblPage;

      // Rendang semula kandungan Grammar tanpa tukar page/reload
      renderGrammarPage(currentPage);
    }

    // 2. Rendering Stroke Order 12-Grid secara kumulatif
    function renderStrokeOrder() {
      const container = document.getElementById('stroke-grid');
      container.innerHTML = '';

      for (let step = 1; step <= 12; step++) {
        const box = document.createElement('div');
        box.className = 'tianzige-box';

        let svgContent = `<svg class="stroke-svg" viewBox="0 0 90 90">`;
        
        // Lukis stroke sedia ada (hitam)
        for (let i = 0; i < step - 1; i++) {
          svgContent += `<path d="${strokePaths[i]}" stroke="#2c3e50" stroke-width="4" fill="none" stroke-linecap="round"/>`;
        }
        // Lukis stroke baharu (merah untuk jelas)
        svgContent += `<path d="${strokePaths[step - 1]}" stroke="#e74c3c" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
        svgContent += `</svg>`;

        box.innerHTML = svgContent + `<span class="stroke-num">${step}</span>`;
        container.appendChild(box);
      }
    }

    // 3. Inisialisasi Pilihan Halaman (Dropdown 3-54)
    function initPagination() {
      const select = document.getElementById('page-selector');
      for (let i = 3; i <= 54; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${uiText[currentLang].pagePrefix} ${i}`;
        select.appendChild(opt);
      }
    }

    // 4. Rendang Kandungan Grammar Bank Mengikut Muka Surat
    function renderGrammarPage(pageNo) {
      currentPage = parseInt(pageNo);
      const data = grammarBankData[currentPage];
      const container = document.getElementById('grammar-content');

      if (!data) return;

      container.innerHTML = `
        <div class="grammar-title">${data.title[currentLang]}</div>
        <p><strong>Rumus / Formula:</strong> <code>${data.formula}</code></p>
        <p>${data.explanation[currentLang]}</p>
        <div class="example-box">
          <strong>Contoh / Example:</strong><br>
          <span style="font-size:16px; font-weight:bold;">${data.exampleCN}</span><br>
          <small><i>${data.examplePinyin}</i></small><br>
          <span>${data.exampleTrans[currentLang]}</span>
        </div>
      `;
    }

    // Jalankan fungsi awal semasa muat turun halaman
    window.onload = function() {
      renderStrokeOrder();
      initPagination();
      renderGrammarPage(3);
    };
  </script>
</body>
</html>
