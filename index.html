    // ----------------------------------------------------
    // 4. AUDIO SYSTEM
    // ----------------------------------------------------
    function speakMandarin(text, speed = audioSpeed) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = speed;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Sistem audio tidak disokong pada pelayar ini.");
      }
    }

    // ----------------------------------------------------
    // 5. NAVIGATION
    // ----------------------------------------------------
    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-red-600');
        btn.classList.add('text-gray-400');
      });
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-400');
        activeBtn.classList.add('text-red-600');
      }

      if (!currentUser.name && tabName !== 'onboarding') {
        renderOnboarding();
        return;
      }

      switch (tabName) {
        case 'home': renderHome(); break;
        case 'learn': renderRoadmap(); break;
        case 'practice': renderPracticeCenter(); break;
        case 'ai-tutor': renderAITutor(); break;
        case 'profile': renderProfile(); break;
        default: renderHome();
      }
      window.scrollTo(0, 0);
    }

            </div>
          </div>

          <form onsubmit="handleAIChat(event)" class="flex space-x-2">
            <input type="text" id="aiInput" placeholder="Tanya tentang perkataan, ayat, atau grammar..." class="flex-1 px-4 py-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500">

          </form>
        </div>
      `;
    }

    function handleAIChat(e) {
      e.preventDefault();
      const input = document.getElementById('aiInput');
      const query = input.value.trim();
      if (!query) return;

      const chatBox = document.getElementById('chatBox');
      
      chatBox.innerHTML += `
        <div class="ml-auto bg-gray-100 dark:bg-gray-700 p-3 rounded-2xl max-w-[85%] text-xs text-right">
          <p class="text-gray-900 dark:text-white">${query}</p>
        </div>
      `;

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // DYNAMIC AI RESPONSE LOGIC
      setTimeout(() => {
        let reply = "";
        const lowerQ = query.toLowerCase();

        // Match Vocab
        const matchedVocab = hskVocab.find(v => lowerQ.includes(v.hanzi) || lowerQ.includes(v.pinyin.toLowerCase()) || lowerQ.includes(v.malay.toLowerCase()));
        
        // Match Grammar
        const matchedGrammar = grammarBankData.find(g => lowerQ.includes(g.title.toLowerCase()) || lowerQ.includes(g.pattern.toLowerCase()));

        if (matchedVocab) {
          reply = `📌 **Perkataan**: ${matchedVocab.hanzi} (${matchedVocab.pinyin})\n` +
                  `💡 **Maksud**: ${matchedVocab.malay}\n` +
                  `✍️ **Contoh Ayat**: ${matchedVocab.exHanzi} (${matchedVocab.exPinyin})\n` +
                  `🗣️ **Terjemahan**: ${matchedVocab.exMalay}`;
        } else if (matchedGrammar) {
          reply = `📚 **Tatabahasa**: ${matchedGrammar.title}\n` +
                  `⚙️ **Formula**: ${matchedGrammar.pattern}\n` +
                  `📝 **Penerangan**: ${matchedGrammar.explanation}\n` +
                  `💬 **Contoh**: ${matchedGrammar.exHanzi} (${matchedGrammar.exPinyin}) - ${matchedGrammar.exMalay}`;
        } else if (lowerQ.includes("apa") || lowerQ.includes("maksud") || lowerQ.includes("bagaimana")) {
          reply = "Dalam HSK Level 1 v3.0, susunan asas ayat ialah **Subjek + Kata Kerja + Objek (SVO)**. Contohnya: 我 (Saya) + 喝 (Minum) + 茶 (Teh) = 我喝茶 (Wǒ hē chá).";
        } else {
          reply = `Soalan anda berkenaan "${query}" diproses mengikut sukatan HSK 1 v3.0. Pastikan menggunakan struktur Subjek + Kata Kerja + Objek, dan sertakan Pinyin serta Nada yang betul. Boleh tanya lagi berkenaan spesifik perkataan atau topik tatabahasa!`;
        }

        chatBox.innerHTML += `
          <div class="bg-red-50 dark:bg-red-950/40 p-3 rounded-2xl max-w-[85%] text-xs space-y-1">
            <p class="font-bold text-red-700 dark:text-red-300">🤖 AI Guru:</p>
            <p class="text-gray-800 dark:text-gray-200 whitespace-pre-line">${reply}</p>
          </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);
    }
