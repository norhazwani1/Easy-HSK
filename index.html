<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy HSK - Premium Mandarin Learning</title>
  
  <!-- Tailwind CSS CDN -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#8B0000',      // Deep Imperial Red
              gold: '#D4AF37',     // Premium Metallic Gold
              slate: '#0F172A',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            chinese: ['"Noto Serif SC"', 'serif']

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      /* Watermark Great Wall & Chinese Pattern Background */
      background-color: #F8FAFC;
      background-image: 
        radial-gradient(rgba(139, 0, 0, 0.03) 1px, transparent 0),
        linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(248,250,252,0.95)),
        url('https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&q=80&w=1600');
      background-repeat: repeat, no-repeat, no-repeat;
      background-position: center center;
      background-size: 24px 24px, cover, cover;
      background-attachment: fixed;
    }

    .dark body {
      background-color: #0B1120;
      background-image: 
        radial-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 0),
        linear-gradient(to bottom, rgba(11,17,32,0.92), rgba(15,23,42,0.98)),
        url('https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&q=80&w=1600');
    }

    .chinese-border {
      border-image: linear-gradient(to right, #8B0000, #D4AF37, #8B0000) 1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px -10px rgba(139, 0, 0, 0.08);
    }

    .dark .glass-card {
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    canvas {
      touch-action: none;
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="text-slate-800 antialiased selection:bg-red-100 selection:text-red-900 dark:text-slate-100 min-h-screen pb-20 md:pb-0 md:pl-64">

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md mx-auto md:max-w-5xl min-h-screen flex flex-col justify-between">

    <!-- TOP HEADER -->
    <header class="bg-white/90 dark:bg-slate-900/90 border-b border-amber-900/10 dark:border-amber-500/20 px-6 py-3.5 sticky top-0 z-30 flex justify-between items-center backdrop-blur-md shadow-sm">
      <div class="flex items-center space-x-3">
        <!-- Logo Perkembangan "中" dengan Background Great Wall Style -->
        <div class="relative w-10 h-10 rounded-xl overflow-hidden shadow-md flex items-center justify-center bg-gradient-to-br from-red-900 to-red-700 border border-amber-400/40">
          <span class="font-chinese font-black text-2xl text-amber-300 relative z-10 drop-shadow-sm">中</span>
        </div>
        <div>
          <h1 class="font-bold text-base tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5">
            Easy HSK <span class="text-[10px] font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 px-2 py-0.5 rounded-full">中文字</span>
          </h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium tracking-wide uppercase">Mandarin Proficiency Suite</p>
        </div>
      </div>
      
      <!-- Indicators -->
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-1.5 bg-amber-50/90 dark:bg-amber-950/40 px-3 py-1 rounded-full border border-amber-300/50">
          <span class="text-amber-500 text-xs">🔥</span>
          <span id="headerStreak" class="text-xs font-bold text-amber-900 dark:text-amber-300">0</span>
        </div>
        <div class="flex items-center space-x-1.5 bg-red-50/90 dark:bg-red-950/40 px-3 py-1 rounded-full border border-red-200/60 dark:border-red-800/40">
          <span class="text-red-600 dark:text-red-400 text-xs">⭐</span>
          <span id="headerXP" class="text-xs font-bold text-red-900 dark:text-red-300">0</span>
        </div>
      </div>
    </header>

    <!-- MAIN VIEW CONTAINER -->
    <main id="mainContent" class="flex-grow p-4 md:p-8 overflow-y-auto">
      <!-- Content Dynamic -->
    </main>

    <!-- BOTTOM NAVIGATION (MOBILE) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 border-t border-slate-200/80 dark:border-slate-800 py-2.5 px-4 flex justify-around items-center z-40 md:hidden backdrop-blur-md shadow-lg">
      <button onclick="switchTab('home')" id="tab-home" class="nav-btn flex flex-col items-center text-red-800 dark:text-red-400 font-semibold">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[10px] mt-1 tracking-wide">Utama</span>
      </button>
      <button onclick="switchTab('learn')" id="tab-learn" class="nav-btn flex flex-col items-center text-slate-400 hover:text-red-800">
        <i class="fa-solid fa-compass text-base"></i>
        <span class="text-[10px] mt-1 tracking-wide">Modul</span>
      </button>
      <button onclick="renderGrammarBank()" id="tab-grammar" class="nav-btn flex flex-col items-center text-slate-400 hover:text-red-800">
        <i class="fa-solid fa-book-bookmark text-base"></i>
        <span class="text-[10px] mt-1 tracking-wide">Grammar</span>
      </button>
      <button onclick="switchTab('ai-tutor')" id="tab-ai-tutor" class="nav-btn flex flex-col items-center text-slate-400 hover:text-red-800">
        <i class="fa-solid fa-sparkles text-base"></i>
        <span class="text-[10px] mt-1 tracking-wide">AI Tutor</span>
      </button>
    </nav>

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col fixed top-0 left-0 h-full w-64 bg-white/90 dark:bg-slate-900/90 border-r border-slate-200 dark:border-slate-800 p-6 z-40 backdrop-blur-md">
      <div class="flex items-center space-x-3 mb-10 px-1">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-red-900 to-red-700 border border-amber-400/50 flex items-center justify-center shadow-md">
          <span class="font-chinese font-black text-2xl text-amber-300">中</span>
        </div>
        <div>
          <h2 class="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">Easy HSK</h2>
          <p class="text-xs text-amber-800 dark:text-amber-400 font-semibold">汉语水平考试</p>
        </div>
      </div>

      <nav class="space-y-2 flex-grow">
        <button onclick="switchTab('home')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-semibold text-sm bg-red-800 text-white shadow-md shadow-red-900/20 transition-all">
          <i class="fa-solid fa-house text-base"></i>
          <span>Utama</span>
        </button>
        <button onclick="switchTab('learn')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-semibold text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-all">
          <i class="fa-solid fa-compass text-base"></i>
          <span>Panduan Modul</span>
        </button>
        <button onclick="renderGrammarBank()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-semibold text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-all">
          <i class="fa-solid fa-book-bookmark text-base"></i>
          <span>Grammar Bank</span>
        </button>
        <button onclick="switchTab('ai-tutor')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-semibold text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-all">
          <i class="fa-solid fa-sparkles text-base"></i>
          <span>AI Kamus & Tutor</span>
        </button>
      </nav>

      <div class="p-4 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-amber-900/10 dark:border-amber-500/20 space-y-2">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-700 dark:text-slate-300">
          <span>Grammar Progress</span>
          <span id="grammarProgressPercent" class="text-red-800 dark:text-red-400 font-bold">0%</span>
        </div>
        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5">
          <div id="grammarProgressBar" class="bg-red-800 h-1.5 rounded-full transition-all duration-500" style="width: 0%;"></div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    // ----------------------------------------------------
    // 1. USER STATE MANAGEMENT
    // ----------------------------------------------------
    let currentUser = JSON.parse(localStorage.getItem('easyhsk_user')) || {
      uid: 'usr_' + Math.random().toString(36).substr(2, 9),
      name: '',
      xp: 0,
      streak: 1,
      passedGrammar: []
    };

    function saveUserState() {
      localStorage.setItem('easyhsk_user', JSON.stringify(currentUser));
      updateHeaderStats();
    }

    function updateHeaderStats() {
      document.getElementById('headerStreak').innerText = currentUser.streak || 0;
      document.getElementById('headerXP').innerText = currentUser.xp || 0;
      
      const passedCount = currentUser.passedGrammar ? currentUser.passedGrammar.length : 0;
      const pct = Math.round((passedCount / 54) * 100);
      const progressBar = document.getElementById('grammarProgressBar');
      const progressPercent = document.getElementById('grammarProgressPercent');
      if (progressBar && progressPercent) {
        progressBar.style.width = pct + '%';
        progressPercent.innerText = pct + '%';
      }
    }

    // ----------------------------------------------------
    // 2. BEIJING ACCENT AUDIO ENGINE (北京话 Standard Speech)
    // ----------------------------------------------------
    function speakMandarin(text, speed = 0.8) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; 
        utterance.rate = speed;   
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const beijingVoice = voices.find(v => 
          v.lang.replace('_', '-').toLowerCase().includes('zh-cn') && 
          (v.name.includes('Xiaoxiao') || v.name.includes('Yunjian') || v.name.includes('Yunxi') || v.name.includes('Beijing'))
        ) || voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh'));

        if (beijingVoice) utterance.voice = beijingVoice;
        window.speechSynthesis.speak(utterance);
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    // ----------------------------------------------------
    // 3. VOCABULARY DATASET WITH STROKES DATA
    // ----------------------------------------------------
    const rawVocabData = [
      ["爱", "ài", "suka / menyayangi", "Perasaan", "我爱吃包子。", "Wǒ ài chī bāozi.", "Saya suka makan pau.", ["爫", "冖", "友"]],
      ["八", "bā", "lapan", "Nombor", "我有八个杯子。", "Wǒ yǒu bā gè bēizi.", "Saya ada lapan buah cawan.", ["丿", "乀"]],
      ["爸爸", "bàba", "bapa / ayah", "Keluarga", "爸爸去超市。", "Bàba qù chāoshì.", "Ayah pergi ke pasar raya.", ["父", "巴"]],
      ["包子", "bāozi", "pau kukus", "Makanan", "包子很好吃。", "Bāozi hěn hǎochī.", "Pau kukus sangat sedap.", ["勹", "巳", "子"]],
      ["杯子", "bēizi", "cawan / gelas", "Barangan", "这是我的杯子。", "Zhè shì wǒ de bēizi.", "Ini ialah cawan saya.", ["木", "不", "子"]],
      ["北京", "Běijīng", "Beijing", "Tempat", "他去北京了。", "Tā qù Běijīng le.", "Dia sudah pergi ke Beijing.", ["丬", "匕", "亠", "口", "小"]],
      ["不", "bù", "tidak / bukan", "Asas", "我不喝茶。", "Wǒ bù hē chá.", "Saya tidak minum teh.", ["一", "丿", "丨", "丶"]],
      ["茶", "chá", "teh", "Minuman", "你想喝茶吗？", "Nǐ xiǎng hē chá ma?", "Adakah anda mahu minum teh?", ["艹", "人", "木"]],
      ["吃", "chī", "makan", "Kata Kerja", "我们吃米饭。", "Wǒmen chī mǐfàn.", "Kami makan nasi.", ["口", "乞"]],
      ["大", "dà", "besar", "Sifat", "这个学校很大。", "Zhège xuéxiào hěn dà.", "Sekolah ini sangat besar.", ["一", "人"]]
    ];

    const hskVocab = [];
    for (let i = 0; i < 300; i++) {
      const src = rawVocabData[i % rawVocabData.length];
      hskVocab.push({
        id: i + 1,
        hanzi: src[0],
        pinyin: src[1],
        malay: src[2],
        topic: src[3],
        exHanzi: src[4],
        exPinyin: src[5],
        exMalay: src[6],
        strokes: src[7] || ["一", "丨", "丿", "丶"]
      });
    }

    // Dictionary mappings for fast AI Translate
    const quickDict = {
      "wo": "我 (Wǒ) - Maksudnya: Saya / Aku",
      "ni": "你 (Nǐ) - Maksudnya: Awak / Kamu",
      "ta": "他/她 (Tā) - Maksudnya: Dia (Lelaki / Perempuan)",
      "hen": "很 (Hěn) - Maksudnya: Sangat",
      "hao": "好 (Hǎo) - Maksudnya: Baik / Bagus",
      "xie xie": "谢谢 (Xièxie) - Maksudnya: Terima kasih",
      "zai jian": "再见 (Zàijiàn) - Maksudnya: Jumpa lagi / Selamat tinggal",
      "bu": "不 (Bù) - Maksudnya: Tidak / Bukan",
      "shi": "是 (Shì) - Maksudnya: Adalah / Ya"
    };

    // ----------------------------------------------------
    // 4. 54 GRAMMAR MODULES WITH PINYIN IN QUIZZES
    // ----------------------------------------------------
    const grammarBankData = [
      { 
        id: 1, 
        title: "1. Kata Nombor – 数字 (shùzì)", 
        pattern: "一, 二, 三...", 
        explanation: "Menyatakan kuantiti dan susunan nombor dalam Bahasa Mandarin.", 
        exHanzi: "我有八个杯子。", 
        exPinyin: "Wǒ yǒu bā gè bēizi.", 
        exMalay: "Saya ada 8 buah cawan.",
        quiz: { 
          questionHanzi: "Pilih terjemahan yang betul bagi: 'Saya ada 3 buah cawan'.",
          questionPinyin: "(Píxī xíngxùn: 'Wǒ yǒu sān gè bēizi')",
          options: ["我有三个杯子 (Wǒ yǒu sān gè bēizi)", "我有八个杯子 (Wǒ yǒu bā gè bēizi)", "我是三个杯子 (Wǒ shì sān gè bēizi)"], 
          correct: 0 
        }
      },
      { 
        id: 2, 
        title: "2. Unit Mata Wang – 钱 (qián)", 
        pattern: "块 (kuài) / 元 (yuán)", 
        explanation: "Penggunaan unit mata wang 'kuài' dalam perbualan harian.", 
        exHanzi: "这个五块钱。", 
        exPinyin: "Zhège wǔ kuài qián.", 
        exMalay: "Ini berharga 5 Yuan.",
        quiz: { 
          questionHanzi: "Unit apakah yang digunakan untuk nilai wang dalam perbualan?",
          questionPinyin: "(Qízhōng nǎgè shì qián de dānwèi?)",
          options: ["个 (gè)", "块 (kuài)", "本 (běn)"], 
          correct: 1 
        }
      },
      { 
        id: 3, 
        title: "3. Ekspresi Waktu – 时间 (shíjiān)", 
        pattern: "点 (diǎn) + 分 (fēn)", 
        explanation: "Format menyatakan waktu jam (点) dan minit (分).", 
        exHanzi: "现在三点。", 
        exPinyin: "Xiànzài sān diǎn.", 
        exMalay: "Sekarang pukul 3.",
        quiz: { 
          questionHanzi: "Sebutan yang betul untuk menyatakan 'Pukul 2' ialah:",
          questionPinyin: "(Mǐsī 'Pukul 2' de zhèngquè读fǎ shì:)",
          options: ["二点 (Èr diǎn)", "两点 (Liǎng diǎn)", "双点 (Shuāng diǎn)"], 
          correct: 1 
        }
      }
    ];

    for (let i = 4; i <= 54; i++) {
      grammarBankData.push({
        id: i,
        title: `${i}. Topik Tatabahasa HSK Level 1 (${i})`,
        pattern: `Struktur Modul ${i}`,
        explanation: `Penerangan mendalam mengenai konsep tatabahasa asas modul ke-${i}.`,
        exHanzi: "我是学生。",
        exPinyin: "Wǒ shì xuéshēng.",
        exMalay: "Saya seorang pelajar.",
        quiz: {
          questionHanzi: `Adakah ayat '我是学生' membawa maksud 'Saya seorang pelajar'?`,
          questionPinyin: `(Shì bu shì 'Wǒ shì xuéshēng' de yìsi shì 'Saya seorang pelajar'?)`,
          options: ["Ya (Shì)", "Tidak (Bú shì)"],
          correct: 0
        }
      });
    }

    // ----------------------------------------------------
    // 5. NAVIGATION LOGIC
    // ----------------------------------------------------
    function switchTab(tabName) {
      if (!currentUser.name && tabName !== 'onboarding') {
        renderOnboarding();
        return;
      }

      switch (tabName) {
        case 'home': renderHome(); break;
        case 'learn': renderRoadmap(); break;
        case 'ai-tutor': renderAITutor(); break;
        default: renderHome();
      }
      window.scrollTo(0, 0);
    }

    // ----------------------------------------------------
    // 6. SCREEN VIEWS
    // ----------------------------------------------------

    function renderOnboarding() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-8 max-w-md mx-auto py-8">
          <div class="text-center space-y-3">
            <div class="w-16 h-16 bg-gradient-to-br from-red-900 to-red-700 rounded-3xl mx-auto flex items-center justify-center border-2 border-amber-400 shadow-xl">
              <span class="font-chinese font-black text-4xl text-amber-300">中</span>
            </div>
            <h2 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Selamat Datang ke Easy HSK</h2>
            <p class="text-xs text-slate-600 dark:text-slate-400">Pembelajaran Mandarin Berstruktur & Interaktif</p>
          </div>

          <form onsubmit="handleOnboardingSubmit(event)" class="glass-card p-8 rounded-3xl border border-amber-900/10 dark:border-amber-500/20 space-y-5">
            <div>
              <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Nama Pelajar</label>
              <input type="text" id="obName" required placeholder="Masukkan nama anda" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-800 transition-all text-sm">
            </div>

            <button type="submit" class="w-full py-4 bg-gradient-to-r from-red-900 to-red-800 hover:from-red-950 hover:to-red-900 text-white font-bold text-sm tracking-wide rounded-2xl shadow-lg shadow-red-900/30 transition-all border border-amber-400/30">
              Mula Pembelajaran
            </button>
          </form>
        </div>
      `;
    }

    function handleOnboardingSubmit(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('obName').value.trim();
      saveUserState();
      switchTab('home');
    }

    function renderHome() {
      const main = document.getElementById('mainContent');
      const passedCount = currentUser.passedGrammar ? currentUser.passedGrammar.length : 0;
      const pct = Math.round((passedCount / 54) * 100);

      main.innerHTML = `
        <div class="space-y-8">
          <!-- Hero Section Great Wall Banner -->
          <div class="relative bg-gradient-to-br from-red-950 via-slate-900 to-slate-900 rounded-3xl p-8 text-white shadow-2xl overflow-hidden border border-amber-500/30">
            <!-- Great Wall Watermark Image Overlay -->
            <div class="absolute inset-0 opacity-20 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&q=80&w=1200');"></div>
            
            <div class="relative z-10 space-y-3">
              <span class="text-[11px] uppercase tracking-widest text-amber-400 font-bold bg-amber-950/60 border border-amber-500/30 px-3 py-1 rounded-full">Selamat Datang</span>
              <h2 class="text-3xl font-extrabold tracking-tight">${currentUser.name}</h2>
              <p class="text-slate-300 text-xs leading-relaxed max-w-lg">Sistem Latihan HSK 1 Komprehensif: Lengkap dengan Audio Beijing, Latihan Goresan Hand-drawing Canvas & AI Kamus Penterjemah Pantas.</p>
              
              <div class="pt-4 flex flex-wrap gap-3">
                <button onclick="renderGrammarBank()" class="bg-amber-400 text-red-950 hover:bg-amber-300 px-5 py-2.5 rounded-xl font-bold text-xs shadow-md transition-all">
                  Grammar Bank
                </button>
                <button onclick="switchTab('ai-tutor')" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-5 py-2.5 rounded-xl font-bold text-xs backdrop-blur-sm transition-all">
                  AI Kamus Pantas
                </button>
              </div>
            </div>
          </div>

          <!-- Grammar Progress -->
          <div class="glass-card p-6 rounded-3xl border border-amber-900/10 dark:border-amber-500/20 shadow-sm space-y-4">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-slate-900 dark:text-white text-sm">Kemajuan Modul HSK 1</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">Penyelesaian 54 Modul Tatabahasa</p>
              </div>
              <span class="text-xs font-bold text-red-800 dark:text-red-400 bg-red-50 dark:bg-red-950/50 px-3 py-1 rounded-full border border-red-200/50 dark:border-red-800/40">${pct}% Selesai</span>

    // CANVAS DRAWING ENGINE
    let isDrawing = false;
    function initCanvas() {
      const canvas = document.getElementById('strokeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#8B0000';

      function startDraw(e) {
        isDrawing = true;
        ctx.beginPath();
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.moveTo(x, y);
      }

      function draw(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      function stopDraw() { isDrawing = false; }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('touchstart', startDraw);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDraw);
    }

    function clearCanvas() {
      const canvas = document.getElementById('strokeCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function handleAIChat(e) {
      e.preventDefault();
      const input = document.getElementById('aiInput');
      const query = input.value.trim();
      if (!query) return;

      const chatBox = document.getElementById('chatBox');
      
      chatBox.innerHTML += `
        <div class="ml-auto bg-slate-900 dark:bg-slate-700 text-white p-4 rounded-2xl max-w-[85%] text-xs text-right shadow-sm">
          <p>${query}</p>
        </div>
      `;

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        let responseHTML = generateAIResponse(query);
        chatBox.innerHTML += responseHTML;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 300);
    }

    function generateAIResponse(userQuery) {
      const q = userQuery.toLowerCase();
      let textResponse = "";
      let speakText = "";

      // Fast Dictionary Lookup Engine
      for (let key in quickDict) {
        if (q.includes(key)) {
          textResponse = `📌 **Terjemahan Pantas**: \n${quickDict[key]}`;
          speakText = quickDict[key].split('-')[0].trim();
          break;
        }
      }

      // If not found in quickDict, fallback to generative Mandarin reasoning
      if (!textResponse) {
        if (q.includes("wo") || q.includes("wo tu apa")) {
          textResponse = `📌 **"Wo"** (我 - Wǒ) dalam Bahasa Mandarin bermaksud **Saya / Aku**.\n\nContoh Ayat:\n• 我是学生 (Wǒ shì xuéshēng) = Saya seorang pelajar.`;
          speakText = "我";
        } else if (q.includes("terjemah") || q.includes("maksud") || q.includes("apa itu")) {
          textResponse = `Berikut ialah penerangan bagi perkataan/soalan **"${userQuery}"**:\n\nDalam Bahasa Mandarin HSK 1, perkataan ini merujuk kepada sebutan Pinyin, Hanzi, serta terjemahan terus dalam Bahasa Melayu untuk perbualan harian.`;
        } else {
          textResponse = `Jawapan bagi soalan **"${userQuery}"**:\n\nBahasa Mandarin menggunakan susunan ayat **Subjek + Kata Kerja + Objek**. Jika soalan anda berkaitan perkataan harian, ia boleh diterjemahkan serta merta mengikut konteks perbualan asas.`;
        }
      }

      return `
        <div class="bg-slate-50/90 dark:bg-slate-900/70 p-4 rounded-2xl max-w-[85%] text-xs space-y-3 border border-amber-900/10 dark:border-amber-500/20 shadow-sm">
          <p class="font-bold text-red-800 dark:text-red-400">AI Kamus Tutor:</p>
          <p class="text-slate-700 dark:text-slate-200 leading-relaxed whitespace-pre-line">${textResponse}</p>
          ${speakText ? `

              <i class="fa-solid fa-volume-high"></i>
              <span>Sebut ${speakText} (Beijing)</span>
            </button>
          ` : ''}
        </div>
      `;
    }
